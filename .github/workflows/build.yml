name: Build EIDCO Business OS App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: Decode Signing Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Generate TWA Project & Build App
        run: |
          # تهيئة المشروع بدون أسئلة تفاعلية باستخدام الخيار التلقائي
          npx @bubblewrap/cli init --manifest=https://karamegy.github.io/EIDCO/manifest.json --signingKeyPath=release.keystore --signingKeyAlias="${{ secrets.KEY_ALIAS }}" --skipValidation
          
          # إتمام بناء الـ APK والـ AAB مباشرة
          npx @bubblewrap/cli build --signingKeyPath=release.keystore --signingKeyAlias="${{ secrets.KEY_ALIAS }}" --signingKeyPassword="${{ secrets.KEY_PASSWORD }}" --keyStorePassword="${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EIDCO-OS-Android-Release
          path: |
            ./*.apk
            ./*.aab
            !release.keystore
