name: Build EIDCO Business OS App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Generate TWA Project Configuration
        run: |
          npx @bubblewrap/cli init --manifest=https://karamegy.github.io/EIDCO/manifest.json --directory=twa-project --signingKeyPath=../release.keystore --signingKeyAlias="${{ secrets.KEY_ALIAS }}"

      - name: Build Signed AAB & APK
        run: |
          cd twa-project
          ./gradlew build bundleRelease \
            -Pandroid.injected.signing.store.file=../release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EIDCO-PlayStore-Release
          path: |
            twa-project/app/build/outputs/bundle/release/*.aab
            twa-project/app/build/outputs/apk/release/*.apk
