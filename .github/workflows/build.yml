name: Build EIDCO Business OS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Required Files and Secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -f manifest.json
          test -f twa-manifest.json

          for name in KEYSTORE_BASE64 \
                      BUBBLEWRAP_KEYSTORE_PASSWORD \
                      BUBBLEWRAP_KEY_PASSWORD \
                      KEY_ALIAS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found: $SDKMANAGER"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Restore Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/android.keystore"

          test -s "$RUNNER_TEMP/android.keystore"
          chmod 600 "$RUNNER_TEMP/android.keystore"

          keytool -list \
            -keystore "$RUNNER_TEMP/android.keystore" \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Configure Bubblewrap
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.bubblewrap"

          node <<'NODE'
          const fs = require('fs');

          fs.writeFileSync(
            process.env.HOME + '/.bubblewrap/config.json',
            JSON.stringify({
              jdkPath: process.env.JAVA_HOME,
              androidSdkPath: process.env.ANDROID_HOME
            }, null, 2)
          );

          const file = 'twa-manifest.json';
          const m = JSON.parse(fs.readFileSync(file, 'utf8'));

          if (m.host !== 'karamegy.github.io') {
            throw new Error('Unexpected host in twa-manifest.json');
          }

          m.signingKey = m.signingKey || {};
          m.signingKey.path =
            process.env.RUNNER_TEMP + '/android.keystore';
          m.signingKey.alias = process.env.KEY_ALIAS;
          m.jdkPath = process.env.JAVA_HOME;
          m.androidSdkPath = process.env.ANDROID_HOME;

          fs.writeFileSync(file, JSON.stringify(m, null, 2) + '\n');
          NODE

      - name: Generate Android Project
        run: |
          bubblewrap update \
            --manifest=./twa-manifest.json \
            --skipVersionUpgrade

      - name: Build Signed APK and AAB
        shell: bash
        run: |
          set -euo pipefail

          bubblewrap build \
            --manifest=./twa-manifest.json \
            --signingKeyPath="$RUNNER_TEMP/android.keystore" \
            --signingKeyAlias="$KEY_ALIAS"

          test -s app-release-signed.apk
          test -s app-release-bundle.aab

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: EIDCO-OS-Android-Release
          path: |
            app-release-signed.apk
            app-release-bundle.aab
          if-no-files-found: error
          retention-days: 14

      - name: Clean Up Signing Key
        if: always()
        run: rm -f "$RUNNER_TEMP/android.keystore"
