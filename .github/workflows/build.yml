name: Build Android APK (Capacitor)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً من تبويب Actions في جيت هاب

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. إعداد بيئة Java (JDK 17) لبناء الأندرويد
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. تثبيت حزم Capacitor وفتح مجلد الأندرويد
      - name: Install Dependencies & Setup Capacitor
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      # 5. إعطاء تصريح التشغيل لملف gradlew
      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      # 6. بناء ملف APK للتطبيق (Debug APK)
      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      # 7. رفع ملف الـ APK النهائي للتحميل من جيت هاب
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EIDCO-Business-OS-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
