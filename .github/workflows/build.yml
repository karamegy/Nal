name: Build EIDCO Business OS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix Android SDK Permissions & Licenses
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R $(whoami):$(id -gn) "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Restore Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "خطأ: سر KEYSTORE_BASE64 غير موجود في GitHub Secrets!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android.keystore
          if [ ! -s android.keystore ]; then
            echo "خطأ: ملف android.keystore فارغ أو فك التشفير غير صحيح!"
            exit 1
          fi
          chmod 600 android.keystore

      - name: Configure Bubblewrap & Build Project Structure
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.bubblewrap
          node -e '
            const fs = require("fs");
            const path = require("path");

            const jdkPath = process.env.JAVA_HOME;
            const androidSdkPath = process.env.ANDROID_HOME;
            const keystorePath = path.resolve("android.keystore");
            const alias = process.env.KEY_ALIAS || "my-key-alias";

            fs.writeFileSync(
              path.join(process.env.HOME, ".bubblewrap", "config.json"),
              JSON.stringify({ jdkPath, androidSdkPath }, null, 2)
            );

            const twaFile = "twa-manifest.json";
            let m = {};
            if (fs.existsSync(twaFile)) {
              m = JSON.parse(fs.readFileSync(twaFile, "utf8"));
            }

            m.jdkPath = jdkPath;
            m.androidSdkPath = androidSdkPath;
            m.signingKey = m.signingKey || {};
            m.signingKey.path = keystorePath;
            m.signingKey.alias = alias;
            m.enableNotifications = false;
            m.fallbackType = "customtabs";
            m.minSdkVersion = 21;
            m.splashScreenFadeOutDuration = 300;

            delete m.shareTarget;

            fs.writeFileSync(twaFile, JSON.stringify(m, null, 2));
          '

          # تحديث هيكل مشروع أندرويد
          bubblewrap update --manifest=twa-manifest.json --skipVersionUpgrade

          # ضبط minSdkVersion لتجنب أخطاء الدمج
          if [ -f "app/build.gradle" ]; then
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' app/build.gradle
          fi

      - name: Build Signed APK & AAB with Gradle Directly
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$(pwd)/android.keystore"
          chmod +x gradlew

          # بناء ملف APK
          ./gradlew assembleRelease \
            -PsigningKeyStorePath="$KEYSTORE_PATH" \
            -PsigningKeyStorePassword="$KEYSTORE_PASSWORD" \
            -PsigningKeyAlias="$KEY_ALIAS" \
            -PsigningKeyPassword="$KEY_PASSWORD" \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

          # بناء ملف AAB
          ./gradlew bundleRelease \
            -PsigningKeyStorePath="$KEYSTORE_PATH" \
            -PsigningKeyStorePassword="$KEYSTORE_PASSWORD" \
            -PsigningKeyAlias="$KEY_ALIAS" \
            -PsigningKeyPassword="$KEY_PASSWORD" \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

          # نقل الملفات الناتجة لصفحة Artifacts
          find app/build/outputs -type f -name "*.apk" -exec cp {} ./EIDCO-OS-release.apk \;
          find app/build/outputs -type f -name "*.aab" -exec cp {} ./EIDCO-OS-release.aab \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EIDCO-OS-Android-Release
          path: |
            *.apk
            *.aab
          if-no-files-found: error
          retention-days: 14

      - name: Clean Up Signing Key
        if: always()
        run: rm -f android.keystore
