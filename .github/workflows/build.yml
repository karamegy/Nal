name: Build EIDCO Business OS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > signing.keystore
            chmod 600 signing.keystore
          fi

      - name: Build Android App via Capacitor
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # 1. تجهيز مجلد الويب www ونسخ كافة ملفات المشروع
          mkdir -p www
          cp -r *.html *.js *.json assets www/ 2>/dev/null || true

          # 2. تثبيت أدوات الكاباسيتور والمكتبات المطلوبة
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/filesystem @capacitor/share @capacitor/assets --save-dev --legacy-peer-deps

          # 3. إعادة إنشاء منصة أندرويد نظيفة
          rm -rf android
          npx cap add android

          # 4. ضبط ملف capacitor.config.json المباشر للرابط الخارجي
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "io.github.karamegy.twa",
            "appName": "EIDCO Business OS",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://karamegy.github.io/Nal/auth.html",
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": [
                "karamegy.github.io",
                "*.firebaseapp.com",
                "*.googleapis.com"
              ]
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "backgroundColor": "#020617"
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 2000,
                "backgroundColor": "#020617",
                "androidScaleType": "CENTER_CROP",
                "splashFullScreen": true,
                "splashImmersive": true
              }
            }
          }
          EOF

          # 5. توليد أحجام الأيقونات لأندرويد
          if [ -f "icon-new-512.png" ]; then
            cp icon-new-512.png assets/icon.png 2>/dev/null || true
          elif [ -f "logo.png" ]; then
            cp logo.png assets/icon.png 2>/dev/null || true
          fi
          
          if [ -f "assets/icon.png" ]; then
            npx @capacitor/assets generate --android || true
          fi

          # 6. نسخ ملف google-services.json إلى مشروع الأندرويد إذا وجد
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/
          fi

          # 7. تجهيز مسارات موفر الملفات والـ AndroidManifest
          mkdir -p android/app/src/main/res/xml/
          cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="external_files" path="." />
              <cache-path name="cache_files" path="." />
              <files-path name="files_path" path="." />
          </paths>
          EOF

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools"
              package="io.github.karamegy.twa">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.USE_FINGERPRINT" />

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="http" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme"
                  tools:overrideLibrary="com.getcapacitor.android, com.capacitorjs.plugins.filesystem, com.capacitorjs.plugins.share">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name="io.github.karamegy.twa.MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="karamegy.github.io" android:pathPrefix="/Nal" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="io.github.karamegy.twa.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

              </application>

          </manifest>
          EOF

          # 8. حقن ملف strings.xml
          mkdir -p android/app/src/main/res/values/
          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">EIDCO Business OS</string>
              <string name="title_activity_main">EIDCO OS</string>
              <string name="package_name">io.github.karamegy.twa</string>
              <string name="custom_url_scheme">io.github.karamegy.twa</string>
              <string name="file_provider_authority">io.github.karamegy.twa.fileprovider</string>
          </resources>
          EOF

          # 9. نسخ ملف التوقيع
          if [ -f "signing.keystore" ]; then
            cp signing.keystore android/app/
          fi

          # 10. تحديث ونسخ ملفات كاباسيتور يدوياً بدون مسح الأصول
          npx cap update android
          npx cap copy android

          # 11. 🛑 إنشاء ملف capacitor.plugins.json وضمان استقراره تماماً
          mkdir -p android/app/src/main/assets
          echo "{}" > android/app/src/main/assets/capacitor.plugins.json

          # 12. إعداد Gradle للتوقيع وضبط الإصدارات
          cat << EOF >> android/app/build.gradle

          android {
              defaultConfig {
                  applicationId "io.github.karamegy.twa"
                  minSdk 24
                  targetSdk 34
                  versionCode 24
                  versionName "8.0.0.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
              signingConfigs {
                  release {
                      storeFile file('signing.keystore')
                      storePassword '$KEYSTORE_PASSWORD'
                      keyAlias '$KEY_ALIAS'
                      keyPassword '$KEY_PASSWORD'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

          # 13. تنظيف مخلفات الكاش والبناء بنجاح تام
          rm -rf ~/.gradle/caches/jars-9/ || true
          rm -rf ~/.gradle/caches/transforms/ || true

          cd android
          chmod +x gradlew
          ./gradlew clean --no-daemon
          ./gradlew bundleRelease --no-daemon
          ./gradlew assembleRelease --no-daemon

          # نقل المخرجات لجذر المشروع
          cd ..
          find android/app/build/outputs -type f -name "*.apk" -exec cp {} ./EIDCO-OS-release.apk \;
          find android/app/build/outputs -type f -name "*.aab" -exec cp {} ./EIDCO-OS-release.aab \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EIDCO-OS-Android-Release
          path: |
            EIDCO-OS-release.apk
            EIDCO-OS-release.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

      - name: Clean Up Signing Key
        if: always()
        run: rm -f signing.keystore android/app/signing.keystore
