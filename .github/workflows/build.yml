name: Build EIDCO Business OS App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Build Tools & Accept Licenses
        run: |
          sudo chown -R $USER:$USER $ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: Decode Signing Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Build Web Assets (If needed)
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build --if-present
          fi

      - name: Configure Bubblewrap & Update Manifest
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            // 1. تحديد المسارات المباشرة مع وجود المسارات الافتراضية لـ GitHub Runner لمنع القيم الفارغة
            const jdkPath = process.env.JAVA_HOME || "/usr/lib/jvm/temurin-17-jdk-amd64";
            const androidSdkPath = process.env.ANDROID_HOME || process.env.ANDROID_SDK_ROOT || "/usr/local/lib/android/sdk";

            console.log("Target JDK Path:", jdkPath);
            console.log("Target Android SDK Path:", androidSdkPath);

            // 2. إنشاء مجلد .bubblewrap وملف config.json بجميع المسميات المعتمدة
            const bubblewrapDir = path.join(process.env.HOME || "/home/runner", ".bubblewrap");
            if (!fs.existsSync(bubblewrapDir)) {
              fs.mkdirSync(bubblewrapDir, { recursive: true });
            }
            
            const configData = {
              jdkPath: jdkPath,
              androidSdkPath: androidSdkPath,
              androidSdk: androidSdkPath
            };
            
            fs.writeFileSync(
              path.join(bubblewrapDir, "config.json"),
              JSON.stringify(configData, null, 2)
            );

            // 3. تحديث twa-manifest.json وتعيين مسار ملف المفتاح المفكوك
            const manifestPath = "twa-manifest.json";
            if (fs.existsSync(manifestPath)) {
              const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
              manifest.appVersionName = "8.0.0.0";
              manifest.appVersionCode = 24;
              manifest.jdkPath = jdkPath;
              manifest.androidSdkPath = androidSdkPath;
              manifest.androidSdk = androidSdkPath;
              
              manifest.signingKey = manifest.signingKey || {};
              manifest.signingKey.path = "./android.keystore";
              if (process.env.KEY_ALIAS) {
                manifest.signingKey.alias = process.env.KEY_ALIAS;
              }
              
              fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2));
              console.log("Manifest successfully updated.");
            } else {
              console.error("Error: twa-manifest.json does not exist in the root folder!");
              process.exit(1);
            }
          '

      - name: Package Web App into Android Artifacts
        run: |
          npx @bubblewrap/cli build --manifest=twa-manifest.json --key-password="${{ secrets.KEY_PASSWORD }}" --store-password="${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EIDCO-OS-Android-Release
          path: |
            ./*.apk
            ./*.aab
            ./manifest.json
            ./sw.js
            !android.keystore
