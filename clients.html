<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIDCO // حسابات العملاء</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #4f46e5; --primary-hover: #4338ca; --bg-main: #f8fafc; --card-bg: #ffffff; --border-color: #e2e8f0; --text-main: #0f172a; --text-muted: #64748b; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; margin: 0; padding-bottom: 5rem; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        .corporate-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .corporate-input { background: #f1f5f9; border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 16px; }
        .btn-primary { background-color: var(--primary); color: #fff; border-radius: 12px; padding: 10px 20px; font-weight: 700; border: none; cursor: pointer; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; font-size: 0.875rem; font-weight: 700; color: var(--text-muted); text-decoration: none; }
        .nav-link:hover, .nav-link.active { background-color: #e0e7ff; color: var(--primary); }
        .custom-modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; }
        .custom-modal.active { display: flex !important; }
    </style>
</head>
<body>
    <div class="flex min-h-screen">
        <aside class="hidden lg:flex flex-col w-72 p-6 bg-white border-l border-slate-200 sticky top-0 h-screen z-40">
            <div class="flex items-center gap-3 mb-8 px-2">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white"><i class="fa-solid fa-cube"></i></div>
                <div><h2 class="font-black text-slate-900 text-base">EIDCO // عيدكو</h2><span class="text-[10px] text-indigo-600 font-mono font-bold">BUSINESS OS</span></div>
            </div>
            <nav class="space-y-1.5 flex-1">
                <a href="index.html" class="nav-link"><i class="fa-solid fa-chart-pie"></i> لوحة التحكم</a>
                <a href="invoices.html" class="nav-link"><i class="fa-solid fa-file-invoice-dollar"></i> الفواتير والمبيعات</a>
                <a href="inventory.html" class="nav-link"><i class="fa-solid fa-boxes-stacked"></i> المخزن والأصناف</a>
                <a href="clients.html" class="nav-link active"><i class="fa-solid fa-building-user"></i> حسابات العملاء</a>
                <a href="chat.html" class="nav-link"><i class="fa-solid fa-comments"></i> الشات والاتصالات</a>
                <a href="profile.html" class="nav-link"><i class="fa-solid fa-id-badge"></i> الملف الشخصي</a>
                <a href="vault.html" class="nav-link"><i class="fa-solid fa-vault"></i> الخزنة النقدية</a>
                <a href="map.html" class="nav-link"><i class="fa-solid fa-map-location-dot"></i> خريطة الأسطول GPS</a>
                <a href="settings.html" class="nav-link"><i class="fa-solid fa-sliders"></i> الإعدادات والنسخ</a>
            </nav>
        </aside>

        <div class="flex-1 flex flex-col min-w-0">
            <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 py-4 sticky top-0 z-30">
                <div class="max-w-7xl mx-auto flex justify-between items-center">
                    <h1 class="font-black text-slate-900 text-sm">إدارة الشركات والعملاء</h1>
                    <button onclick="openClientModal()" class="btn-primary text-xs flex items-center gap-2"><i class="fa-solid fa-user-plus"></i> إضافة عميل جديد</button>
                </div>
            </header>

            <main class="max-w-7xl w-full mx-auto p-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="clientsGrid"></div>
            </main>
        </div>
    </div>

    <div id="clientModal" class="custom-modal">
        <div class="corporate-card p-6 max-w-sm w-full space-y-4 text-right bg-white shadow-2xl">
            <h3 class="font-bold text-sm text-slate-900">إضافة عميل أو شركة جديدة</h3>
            <div class="space-y-3 text-xs">
                <div><label class="block mb-1 text-slate-600">اسم العميل</label><input type="text" id="clientName" class="corporate-input w-full"></div>
                <div><label class="block mb-1 text-slate-600">الهاتف</label><input type="text" id="clientPhone" class="corporate-input w-full mono-font"></div>
                <div><label class="block mb-1 text-slate-600">العنوان</label><input type="text" id="clientAddress" class="corporate-input w-full"></div>
            </div>
            <div class="flex gap-2 pt-2"><button onclick="saveClient()" class="btn-primary flex-1 py-2 text-xs">حفظ</button><button onclick="closeModal()" class="bg-slate-200 text-slate-700 flex-1 py-2 rounded-xl text-xs font-bold cursor-pointer">إلغاء</button></div>
        </div>
    </div>

    <script>
        let clients = JSON.parse(localStorage.getItem('eidco_v13_clients')) || [];
        function saveData() {
            localStorage.setItem('eidco_v13_clients', JSON.stringify(clients));
            renderClients();
        }
        function renderClients() {
            document.getElementById('clientsGrid').innerHTML = clients.map(c => `
                <div class="corporate-card p-4 space-y-2">
                    <h4 class="font-bold text-sm text-slate-900">${c.name}</h4>
                    <p class="text-xs text-slate-500"><i class="fa-solid fa-phone text-indigo-600 ml-1"></i> ${c.phone||'غير مسجل'}</p>
                    <p class="text-xs text-slate-500"><i class="fa-solid fa-location-dot text-purple-600 ml-1"></i> ${c.address||'القاهرة'}</p>
                    <div class="pt-2 flex justify-between">
                        <a href="chat.html" class="text-indigo-600 hover:text-indigo-800 text-xs font-bold"><i class="fa-solid fa-comments ml-1"></i>مراسلة</a>
                        <button onclick="deleteClient(${c.id})" class="text-rose-500 hover:text-rose-700 text-xs font-bold"><i class="fa-solid fa-trash ml-1"></i>حذف</button>
                    </div>
                </div>
            `).join('');
        }
        function openClientModal() { document.getElementById('clientModal').classList.add('active'); }
        function closeModal() { document.getElementById('clientModal').classList.remove('active'); }
        function saveClient() {
            let name = document.getElementById('clientName').value;
            if(!name) return alert('أدخل اسم العميل');
            clients.push({ id: Date.now(), name, phone: document.getElementById('clientPhone').value, address: document.getElementById('clientAddress').value });
            closeModal(); saveData();
        }
        function deleteClient(id) { clients = clients.filter(c => c.id !== id); saveData(); }
        renderClients();
    </script>
</body>
</html>
