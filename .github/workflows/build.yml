name: Build EIDCO Business OS App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & Accept Licenses
        run: |
          # 1. إعطاء الملكية الكاملة لمجلد Android SDK الافتراضي
          sudo chown -R $USER:$USER $ANDROID_HOME

          # 2. تثبيت الحزم المطلوبة وتأكيد التراخيص
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

          # 3. نسخ التراخيص إلى مجلد SDK ومجلد المستخدم لضمان تعرّف Bubblewrap عليها
          mkdir -p $ANDROID_HOME/licenses
          mkdir -p ~/.android/licenses
          cp -r ~/.android/licenses/* $ANDROID_HOME/licenses/ 2>/dev/null || true
          cp -r $ANDROID_HOME/licenses/* ~/.android/licenses/ 2>/dev/null || true

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode Signing Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Configure Bubblewrap & Update Manifest
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # 1. إنشاء ملف config.json المعتمد لأداة Bubblewrap
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

          # 2. تحديث twa-manifest.json بالمسارات الفعلية
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            
            manifest.jdkPath = process.env.JAVA_HOME;
            manifest.androidSdkPath = process.env.ANDROID_HOME;
            manifest.signingKey = manifest.signingKey || {};
            manifest.signingKey.path = "./android.keystore";
            if (process.env.KEY_ALIAS) {
              manifest.signingKey.alias = process.env.KEY_ALIAS;
            }
            
            fs.writeFileSync("twa-manifest.json", JSON.stringify(manifest, null, 2));
          '

      - name: Package Web App into Android Artifacts
        run: |
          bubblewrap build --manifest=twa-manifest.json --keyPassword="${{ secrets.KEY_PASSWORD }}" --storePassword="${{ secrets.KEYSTORE_PASSWORD }}" --key-password="${{ secrets.KEY_PASSWORD }}" --store-password="${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EIDCO-OS-Android-Release
          path: |
            ./*.apk
            ./*.aab
            ./manifest.json
            ./sw.js
            !android.keystore
