name: Build EIDCO Business OS App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools & Accept Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap Environment
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

      - name: Decode Signing Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Build Web Assets (If needed)
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build --if-present
          fi

      - name: Update Manifest Dynamic Paths, Alias & Version
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          node -e '
            const fs = require("fs");
            const file = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            file.appVersionName = "8.0.0.0";
            file.appVersionCode = 24;
            file.jdkPath = process.env.JAVA_HOME;
            file.androidSdkPath = process.env.ANDROID_HOME || process.env.ANDROID_SDK_ROOT;
            if (process.env.KEY_ALIAS) {
              file.signingKey.alias = process.env.KEY_ALIAS;
            }
            fs.writeFileSync("twa-manifest.json", JSON.stringify(file, null, 2));
          '

      - name: Package Web App into Android Artifacts
        run: |
          npx @bubblewrap/cli build --manifest=twa-manifest.json --key-password="${{ secrets.KEY_PASSWORD }}" --store-password="${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EIDCO-OS-Android-Release
          path: |
            ./*.apk
            ./*.aab
            ./manifest.json
            ./sw.js
            !android.keystore
