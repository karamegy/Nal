name: Build EIDCO Business OS App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Build Tools & Accept Licenses
        run: |
          # 1. قبول كافة التراخيص الخاصة بـ Android SDK
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # 2. تثبيت الحزم الأساسية التي تشترطها Bubblewrap للتحقق من صحة المسار
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: Decode Signing Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Build Web Assets (If needed)
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build --if-present
          fi

      - name: Configure Bubblewrap & Update Manifest
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            const jdkPath = process.env.JAVA_HOME;
            const androidSdkPath = process.env.ANDROID_HOME;

            // 1. إنشاء ملف الإعدادات الخاص بـ Bubblewrap تلقائياً
            const bubblewrapDir = path.join(process.env.HOME, ".bubblewrap");
            if (!fs.existsSync(bubblewrapDir)) {
              fs.mkdirSync(bubblewrapDir, { recursive: true });
            }
            fs.writeFileSync(
              path.join(bubblewrapDir, "config.json"),
              JSON.stringify({ jdkPath, androidSdkPath }, null, 2)
            );

            // 2. تحديث twa-manifest.json بالمسارات وحساب الـ Alias المعتمد
            const manifest = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            manifest.appVersionName = "8.0.0.0";
            manifest.appVersionCode = 24;
            manifest.jdkPath = jdkPath;
            manifest.androidSdkPath = androidSdkPath;
            if (process.env.KEY_ALIAS) {
              manifest.signingKey = manifest.signingKey || {};
              manifest.signingKey.alias = process.env.KEY_ALIAS;
            }
            fs.writeFileSync("twa-manifest.json", JSON.stringify(manifest, null, 2));
          '

      - name: Package Web App into Android Artifacts
        run: |
          npx @bubblewrap/cli build --manifest=twa-manifest.json --key-password="${{ secrets.KEY_PASSWORD }}" --store-password="${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EIDCO-OS-Android-Release
          path: |
            ./*.apk
            ./*.aab
            ./manifest.json
            ./sw.js
            !android.keystore
