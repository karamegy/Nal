name: Build EIDCO Business OS App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI (TWA Builder)
        run: |
          npm install -g @bubblewrap/cli

      - name: Decode Signing Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Build Web Assets (If needed)
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build --if-present
          fi

      - name: Update Version in twa-manifest
        run: |
          # تحديث رقم الإصدار (Version Name & Code) تلقائياً قبل البناء
          node -e '
            const fs = require("fs");
            const file = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            file.appVersionName = "8.0.0.0";
            file.appVersionCode = 24;
            fs.writeFileSync("twa-manifest.json", JSON.stringify(file, null, 2));
          '

      - name: Package Web App into Android Artifacts
        run: |
          echo "Building Android Package (v8.0.0.0, Code 24) automatically..."
          npx @bubblewrap/cli build --manifest=twa-manifest.json --key-password="${{ secrets.KEY_PASSWORD }}" --store-password="${{ secrets.KEYSTORE_PASSWORD }}" --skip-jdk-check --non-interactive

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EIDCO-OS-Android-Release
          path: |
            ./*.apk
            ./*.aab
            ./manifest.json
            ./sw.js
            !android.keystore
