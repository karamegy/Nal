name: Build EIDCO Business OS App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode Signing Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Prepare Android SDK & Configure Bubblewrap
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # 1. ضبط ملكية وتراخيص Android SDK
          sudo chown -R $USER:$USER $ANDROID_HOME
          mkdir -p $ANDROID_HOME/licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

          # 2. إنشاء config.json وتحديث twa-manifest.json بالمسارات الحية
          mkdir -p ~/.bubblewrap
          node -e '
            const fs = require("fs");
            const path = require("path");

            const jdkPath = process.env.JAVA_HOME;
            const androidSdkPath = process.env.ANDROID_HOME;

            // كتابة إعدادات Bubblewrap الرسمية
            fs.writeFileSync(
              path.join(process.env.HOME, ".bubblewrap", "config.json"),
              JSON.stringify({ jdkPath, androidSdkPath }, null, 2)
            );

            // استبدال المسارات القديمة داخل twa-manifest.json بمسارات السيرفر الحالية
            const manifest = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            manifest.jdkPath = jdkPath;
            manifest.androidSdkPath = androidSdkPath;
            manifest.signingKey = manifest.signingKey || {};
            manifest.signingKey.path = "./android.keystore";
            if (process.env.KEY_ALIAS) {
              manifest.signingKey.alias = process.env.KEY_ALIAS;
            }
            fs.writeFileSync("twa-manifest.json", JSON.stringify(manifest, null, 2));
          '

      - name: Package Web App into Android Artifacts
        run: |
          bubblewrap build --manifest=twa-manifest.json --keyPassword="${{ secrets.KEY_PASSWORD }}" --storePassword="${{ secrets.KEYSTORE_PASSWORD }}" --key-password="${{ secrets.KEY_PASSWORD }}" --store-password="${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EIDCO-OS-Android-Release
          path: |
            ./*.apk
            ./*.aab
            ./manifest.json
            ./sw.js
            !android.keystore
