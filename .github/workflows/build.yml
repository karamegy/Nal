name: Build EIDCO Business OS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix Android SDK Permissions & Licenses
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R $(whoami):$(id -gn) "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Restore & Validate Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "خطأ: سر KEYSTORE_BASE64 غير موجود في GitHub Secrets!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android.keystore
          if [ ! -s android.keystore ]; then
            echo "خطأ: ملف android.keystore فارغ أو فك التشفير غير صحيح!"
            exit 1
          fi
          chmod 600 android.keystore

          # فحص صحة بيانات المفتاح والرمز السري قبل بدء البناء
          keytool -list -v -keystore android.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1 || {
            echo "خطأ: كلمة مرور Keystore أو الـ KEY_ALIAS غير صحيحة في GitHub Secrets!"
            exit 1
          }

      - name: Configure Bubblewrap & Build Project Structure
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.bubblewrap
          node -e '
            const fs = require("fs");
            const path = require("path");

            const jdkPath = process.env.JAVA_HOME;
            const androidSdkPath = process.env.ANDROID_HOME;
            const keystorePath = path.resolve("android.keystore");
            const alias = process.env.KEY_ALIAS || "my-key-alias";

            fs.writeFileSync(
              path.join(process.env.HOME, ".bubblewrap", "config.json"),
              JSON.stringify({ jdkPath, androidSdkPath }, null, 2)
            );

            const twaFile = "twa-manifest.json";
            let m = {};
            if (fs.existsSync(twaFile)) {
              try { m = JSON.parse(fs.readFileSync(twaFile, "utf8")); } catch(e) { m = {}; }
            }

            m.packageId = m.packageId || "io.github.karamegy.twa";
            m.host = "karamegy.github.io";
            m.name = m.name || "EIDCO Business OS & Logistics";
            m.launcherName = m.launcherName || "EIDCO OS";
            m.display = "standalone";
            m.themeColor = m.themeColor || "#4f46e5";
            m.navigationColor = m.navigationColor || "#0f172a";
            m.startUrl = m.startUrl || "/Nal/auth.html?pwa=eidco";
            m.startUrlPath = m.startUrlPath || "/Nal/auth.html?pwa=eidco";
            m.iconUrl = m.iconUrl || "https://karamegy.github.io/Nal/icon-new-512.png";
            m.maskableIconUrl = m.maskableIconUrl || "https://karamegy.github.io/Nal/icon-new-512.png";
            m.appVersionName = m.appVersionName || "8.0.0.0";
            m.appVersionCode = m.appVersionCode || 24;
            m.webManifestUrl = "https://karamegy.github.io/Nal/manifest.json";
            m.generatorApp = "bubblewrap-cli";

            m.jdkPath = jdkPath;
            m.androidSdkPath = androidSdkPath;
            m.signingKey = { path: keystorePath, alias: alias };
            m.enableNotifications = false;
            m.fallbackType = "customtabs";
            m.minSdkVersion = 21;
            m.splashScreenFadeOutDuration = 300;

            delete m.shareTarget;

            fs.writeFileSync(twaFile, JSON.stringify(m, null, 2));
          '

          # إنشاء مشروع جديد إذا لم يكن مجلد app موجوداً، أو تحديثه إن كان موجوداً
          if [ -d "app" ]; then
            bubblewrap update --manifest=twa-manifest.json --skipVersionUpgrade
          else
            bubblewrap init --manifest=twa-manifest.json
          fi

          # إجبار ضبط minSdkVersion لمنع تعارض المانفيست
          if [ -f "app/build.gradle" ]; then
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' app/build.gradle
          fi

          # نسخ ملف المفتاح داخل مجلد التطبيق لضمان الوصول إليه
          cp android.keystore app/android.keystore || true

      - name: Build Signed APK & AAB with Gradle Directly
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$(pwd)/android.keystore"
          chmod +x gradlew

          ./gradlew clean || true

          # بناء ملف APK
          ./gradlew assembleRelease \
            -PsigningKeyStorePath="$KEYSTORE_PATH" \
            -PsigningKeyStorePassword="$KEYSTORE_PASSWORD" \
            -PsigningKeyAlias="$KEY_ALIAS" \
            -PsigningKeyPassword="$KEY_PASSWORD" \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

          # بناء ملف AAB
          ./gradlew bundleRelease \
            -PsigningKeyStorePath="$KEYSTORE_PATH" \
            -PsigningKeyStorePassword="$KEYSTORE_PASSWORD" \
            -PsigningKeyAlias="$KEY_ALIAS" \
            -PsigningKeyPassword="$KEY_PASSWORD" \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

          # نقل المخرجات لصفحة Artifacts
          find app/build/outputs -type f -name "*.apk" -exec cp {} ./EIDCO-OS-release.apk \;
          find app/build/outputs -type f -name "*.aab" -exec cp {} ./EIDCO-OS-release.aab \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EIDCO-OS-Android-Release
          path: |
            *.apk
            *.aab
          if-no-files-found: error
          retention-days: 14

      - name: Clean Up Signing Key
        if: always()
        run: rm -f android.keystore app/android.keystore
