name: Build EIDCO Business OS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Restore Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android.keystore
          test -s android.keystore

      - name: Configure Bubblewrap & twa-manifest
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          # 1. قبول تراخيص Android SDK المدمج تلقائياً
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

          # 2. إنشاء إعدادات Bubblewrap
          mkdir -p ~/.bubblewrap
          node -e '
            const fs = require("fs");
            fs.writeFileSync(
              process.env.HOME + "/.bubblewrap/config.json",
              JSON.stringify({
                jdkPath: process.env.JAVA_HOME,
                androidSdkPath: process.env.ANDROID_HOME
              }, null, 2)
            );
          '

          # 3. ربط المسارات والمفتاح داخل twa-manifest.json
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            m.jdkPath = process.env.JAVA_HOME;
            m.androidSdkPath = process.env.ANDROID_HOME;
            m.signingKey = m.signingKey || {};
            m.signingKey.path = "./android.keystore";
            m.signingKey.alias = process.env.KEY_ALIAS;
            fs.writeFileSync("twa-manifest.json", JSON.stringify(m, null, 2));
          '

      - name: Build Signed APK and AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          bubblewrap build \
            --manifest=twa-manifest.json \
            --keyPassword="$KEY_PASSWORD" \
            --storePassword="$KEYSTORE_PASSWORD"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EIDCO-OS-Android-Release
          path: |
            *.apk
            *.aab
          if-no-files-found: error
          retention-days: 14

      - name: Clean Up Signing Key
        if: always()
        run: rm -f android.keystore
