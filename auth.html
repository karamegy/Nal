<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIDCO // إدارة الحسابات والمصادقة المتقدمة المعزولة</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4f46e5">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error: ', err));
        });
      }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #4f46e5; --primary-hover: #4338ca; --bg-main: #0f172a; --card-bg: #1e293b; --border-color: #334155; --text-main: #f8fafc; --text-muted: #94a3b8; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        .corporate-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
        .corporate-input { background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 12px; padding: 12px 16px; transition: all 0.2s; }
        .corporate-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.3); }
        .btn-primary { background-color: var(--primary); color: #fff; border-radius: 12px; padding: 12px 20px; font-weight: 700; border: none; cursor: pointer; transition: all 0.2s; }
        .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        .custom-modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; }
        .custom-modal.active { display: flex !important; }
        @keyframes pulseRing {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 25px rgba(79, 70, 229, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
        }
        .ring-pulse { animation: pulseRing 2s infinite; }
    </style>
</head>
<body class="selection:bg-indigo-500 selection:text-white">

    <div class="corporate-card p-8 max-w-lg w-full space-y-6 text-right relative overflow-hidden">
        <div class="absolute -top-12 -left-12 w-32 h-32 bg-indigo-600/20 rounded-full blur-2xl"></div>

        <!-- زر التثبيت البرمجي الظاهر عند جهوزية المتصفح -->
        <div id="installContainer" class="hidden text-center relative z-10">
            <button id="installAppBtn" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black py-3 px-5 rounded-xl text-xs flex items-center justify-center gap-2 mx-auto shadow-lg transition cursor-pointer w-full border border-emerald-400/30">
                <i class="fa-solid fa-download text-amber-300 text-sm"></i> تثبيت تطبيق EIDCO الرسمي على الهاتف
            </button>
        </div>

        <div class="flex justify-between items-center relative z-10">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-cube text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black text-white">EIDCO v14 // الأمان المعزول</h1>
                    <p class="text-[10px] text-slate-400 font-mono">تسجيل الدخول ومزامنة البصمة والحسابات السحابية</p>
                </div>
            </div>
            
            <button id="addAccountBtn" onclick="openAddAccountModal()" class="hidden bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-400 border border-indigo-500/30 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 cursor-pointer">
                <i class="fa-solid fa-user-plus"></i> إضافة حساب
            </button>
        </div>

        <div class="grid grid-cols-2 gap-3 relative z-10 pt-2">
            <button onclick="signInWithGoogle()" class="bg-white hover:bg-slate-100 text-slate-900 font-bold py-2.5 px-4 rounded-xl text-xs flex items-center justify-center gap-2 transition shadow cursor-pointer border border-slate-200">
                <i class="fa-brands fa-google text-rose-500 text-sm"></i> تسجيل بـ Google
            </button>
            <button onclick="openPhoneAuthModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2.5 px-4 rounded-xl text-xs flex items-center justify-center gap-2 transition shadow cursor-pointer border border-slate-700">
                <i class="fa-solid fa-phone text-emerald-400 text-sm"></i> تسجيل برقم الهاتف
            </button>
        </div>

        <div class="relative flex py-1 items-center z-10">
            <div class="flex-grow border-t border-slate-700"></div>
            <span class="flex-shrink mx-4 text-slate-500 text-[10px] font-mono">أو بالاسم والبصمة البيومترية السحابية</span>
            <div class="flex-grow border-t border-slate-700"></div>
        </div>

        <div class="space-y-2 relative z-10">
            <label class="block text-xs text-slate-300 font-bold">اسم المستخدم / الحساب / الشركة:</label>
            <input type="text" id="usernameInput" class="corporate-input w-full text-xs font-bold" placeholder="أدخل اسم الحساب المسجل للبدء..." oninput="checkFounderAccess()">
        </div>

        <div class="p-5 bg-slate-900/60 rounded-2xl border border-slate-800 text-center space-y-3 relative z-10">
            <div onclick="performBiometricAuth()" class="w-16 h-16 mx-auto bg-indigo-600/10 border-2 border-indigo-500/40 rounded-full flex items-center justify-center cursor-pointer shadow-lg hover:scale-105 transition ring-pulse" title="انقر لبدء البصمة">
                <i class="fa-solid fa-fingerprint text-2xl text-indigo-400"></i>
            </div>
            <div>
                <span class="text-xs text-indigo-400 font-mono block font-bold" id="bioStatusText">انقر لإجراء المصادقة السحابية بالبصمة</span>
                <span class="text-[10px] text-slate-500 block mt-1" id="selectedAccountDisplay">يرجى كتابة اسم مسجل ثم النقر على البصمة للدخول</span>
            </div>
        </div>

        <div class="text-center pt-2 border-t border-slate-800 text-[10px] text-slate-500 font-mono flex justify-between items-center">
            <span>EIDCO Business OS &copy; 2026</span>
            <button id="resetBtn" onclick="resetDefaultAccounts()" class="hidden text-slate-400 hover:text-rose-400 transition cursor-pointer">إعادة ضبط الافتراضي</button>
        </div>
    </div>

    <div id="phoneAuthModal" class="custom-modal">
        <div class="corporate-card p-6 max-w-sm w-full space-y-4 text-right bg-slate-900 shadow-2xl border border-slate-700">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-sm text-white"><i class="fa-solid fa-phone ml-2 text-emerald-400"></i> تسجيل الدخول برقم الهاتف</h3>
                <button onclick="closePhoneAuthModal()" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div class="space-y-3 text-xs">
                <div id="phoneStep1">
                    <label class="block mb-1 text-slate-300 font-bold">رقم الهاتف (مع رمز الدولة)</label>
                    <input type="tel" id="userPhoneNumber" class="corporate-input w-full text-xs mono-font" placeholder="+2010xxxxxxxx">
                    <button onclick="sendPhoneVerificationCode()" class="btn-primary w-full mt-3 py-2.5 text-xs">إرسال رمز التحقق</button>
                </div>
                <div id="phoneStep2" class="hidden space-y-2">
                    <label class="block mb-1 text-slate-300 font-bold">أدخل رمز التحقق (OTP)</label>
                    <input type="text" id="phoneOtpCode" class="corporate-input w-full text-xs mono-font text-center tracking-widest text-lg" placeholder="123456">
                    <button onclick="verifyPhoneOtpCode()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold w-full mt-2 py-2.5 rounded-xl text-xs transition cursor-pointer">تأكيد الرمز ودخول المنظومة</button>
                </div>
                <div id="recaptcha-container"></div>
            </div>
        </div>
    </div>

    <div id="addAccountModal" class="custom-modal">
        <div class="corporate-card p-6 max-w-sm w-full space-y-4 text-right bg-slate-900 shadow-2xl border border-slate-700">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-sm text-white"><i class="fa-solid fa-user-plus ml-2 text-indigo-500"></i> إضافة حساب / مسؤول جديد</h3>
                <button onclick="closeAddAccountModal()" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block mb-1 text-slate-300 font-bold">اسم المسؤول / المستخدم</label>
                    <input type="text" id="newAccountName" class="corporate-input w-full text-xs" placeholder="أدخل الاسم الكامل">
                </div>
                <div>
                    <label class="block mb-1 text-slate-300 font-bold">الصلاحية / الدور</label>
                    <select id="newAccountRole" class="corporate-input w-full text-xs">
                        <option value="مدير نظام رئيسي">مدير نظام رئيسي</option>
                        <option value="محاسب أول">محاسب أول</option>
                        <option value="مسؤول مخزن">مسؤول مخزن</option>
                        <option value="مشرف أسطول">مشرف أسطول</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="saveNewAccount()" class="btn-primary flex-1 py-2 text-xs">حفظ بالسحابة</button>
                <button onclick="closeAddAccountModal()" class="bg-slate-800 text-slate-300 hover:bg-slate-700 flex-1 py-2 rounded-xl text-xs font-bold cursor-pointer">إلغاء</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            deleteDoc, 
            doc, 
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { 
            getAuth, 
            signInAnonymously, 
            GoogleAuthProvider, 
            signInWithPopup, 
            RecaptchaVerifier, 
            signInWithPhoneNumber 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC69al0BNfnnMm7tzBTcnch5VdrhUugYtA",
            authDomain: "w2a-37531-672997.firebaseapp.com",
            projectId: "w2a-37531-672997",
            storageBucket: "w2a-37531-672997.firebasestorage.app",
            messagingSenderId: "515898424721",
            appId: "1:515898424721:web:f9d4d842bc621db2da6e30"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const accountsRef = collection(db, "accounts");

        const FOUNDER_NAME = "كرم حمدي عبدالعظيم";
        let accountsData = [];

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const container = document.getElementById('installContainer');
            if (container) {
                container.classList.remove('hidden');
            }
        });

        document.getElementById('installAppBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('تم تثبيت التطبيق بنجاح');
                }
                deferredPrompt = null;
                document.getElementById('installContainer').classList.add('hidden');
            }
        });

        onSnapshot(accountsRef, (snapshot) => {
            accountsData = snapshot.docs.map(docSnap => ({
                id: docSnap.id,
                ...docSnap.data()
            }));

            if (accountsData.length === 0) {
                addDoc(accountsRef, {
                    name: FOUNDER_NAME,
                    role: 'مدير نظام رئيسي',
                    companyId: 'company_founder_karm',
                    date: new Date().toISOString().split('T')[0]
                });
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const savedAdmin = localStorage.getItem('eidco_v14_admin') || '';
            const inputEl = document.getElementById('usernameInput');
            if (savedAdmin) {
                inputEl.value = savedAdmin;
            }
            window.checkFounderAccess();
        });

        window.checkFounderAccess = function() {
            const inputVal = document.getElementById('usernameInput').value.trim();
            const addBtn = document.getElementById('addAccountBtn');
            const resetBtn = document.getElementById('resetBtn');

            if (inputVal === FOUNDER_NAME) {
                addBtn.classList.remove('hidden');
                resetBtn.classList.remove('hidden');
            } else {
                addBtn.classList.add('hidden');
                resetBtn.classList.add('hidden');
            }

            if (inputVal) {
                document.getElementById('selectedAccountDisplay').innerText = `الحساب المستهدف: ${inputVal}`;
            } else {
                document.getElementById('selectedAccountDisplay').innerText = `يرجى كتابة اسم مسجل ثم النقر على البصمة للدخول`;
            }
        };

        async function mandateBiometricLinking(userName) {
            alert(`🔒 نظام الأمان EIDCO: يتطلب تأكيد بصمة الإصبع (Biometric) لربط حسابك (${userName}) سحابياً.`);
            try {
                if (window.PublicKeyCredential && navigator.credentials) {
                    const challenge = new Uint8Array(32);
                    window.crypto.getRandomValues(challenge);
                    const createCredentialOptions = {
                        publicKey: {
                            challenge: challenge,
                            rp: { name: "EIDCO Business OS", id: window.location.hostname === 'localhost' ? 'localhost' : window.location.hostname },
                            user: {
                                id: Uint8Array.from(userName, c => c.charCodeAt(0)),
                                name: userName,
                                displayName: userName
                            },
                            pubKeyCredParams: [{ alg: -7, type: "pub-key" }, { alg: -257, type: "pub-key" }],
                            timeout: 60000,
                            attestation: "none",
                            authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" }
                        }
                    };
                    await navigator.credentials.create(createCredentialOptions);
                    alert("✓ تم التحقق وربط البصمة بنجاح!");
                    return true;
                } else {
                    await new Promise(r => setTimeout(r, 800));
                    alert("✓ تمت محاكاة وتوثيق البصمة بنجاح.");
                    return true;
                }
            } catch (e) {
                alert("⚠️ تنبيه: تم تخطي أو إلغاء مسح البصمة سحابياً.");
                return false;
            }
        }

        window.signInWithGoogle = async function() {
            try {
                const provider = new GoogleAuthProvider();
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                let userEmail = user.email || '';
                let userDisplayName = user.displayName || userEmail.split('@')[0];
                let userPhotoUrl = user.photoURL || '';

                let assignedCompanyId;
                let finalUserName;
                let userRole = 'محاسب أول';

                // البحث عما إذا كان هذا البريد مسجلاً مسبقاً للحفاظ على استقلاليته وبيئته المعزولة الخاصة به
                let existingAccount = accountsData.find(a => (a.email && a.email.toLowerCase() === userEmail.toLowerCase()));
                
                if (existingAccount) {
                    finalUserName = existingAccount.name;
                    assignedCompanyId = existingAccount.companyId;
                    userRole = existingAccount.role || 'محاسب أول';
                } else {
                    // إنشاء معرف شركة مستقل ومعزول تماماً لكل بريد جوجل جديد
                    finalUserName = userDisplayName;
                    let cleanEmailKey = userEmail.replace(/[^a-zA-Z0-9]/g, '_');
                    assignedCompanyId = 'company_google_' + (cleanEmailKey || user.uid.substring(0, 8));
                    
                    if (userEmail === 'haretg@gmail.com') {
                        assignedCompanyId = 'company_founder_karm';
                        finalUserName = FOUNDER_NAME;
                        userRole = 'مدير نظام رئيسي';
                    }
                }

                // تفعيل البصمة الإجبارية لتوثيق الحساب المعزول
                await mandateBiometricLinking(finalUserName);

                const existingDoc = accountsData.find(a => a.companyId === assignedCompanyId);
                if (!existingDoc) {
                    await addDoc(accountsRef, {
                        name: finalUserName,
                        role: userRole,
                        companyId: assignedCompanyId,
                        email: userEmail,
                        avatar: userPhotoUrl,
                        biometricLinked: true,
                        date: new Date().toISOString().split('T')[0]
                    });
                }

                sessionStorage.setItem('eidco_session_auth', 'true');
                localStorage.setItem('eidco_v14_admin', finalUserName);
                localStorage.setItem('eidco_current_company_id', assignedCompanyId);

                alert(`✓ أهلاً بك يا ${finalUserName}, تمت مزامنة السحابة والدخول بنجاح!`);
                window.location.href = `./index.html?companyId=${encodeURIComponent(assignedCompanyId)}`;
            } catch (error) {
                alert('فشل تسجيل الدخول بواسطة Google: ' + error.message);
            }
        };

        window.openPhoneAuthModal = function() {
            document.getElementById('phoneAuthModal').classList.add('active');
        };
        window.closePhoneAuthModal = function() {
            document.getElementById('phoneAuthModal').classList.remove('active');
        };

        let confirmationResult = null;

        window.sendPhoneVerificationCode = async function() {
            let phoneNumber = document.getElementById('userPhoneNumber').value.trim();
            if(!phoneNumber) {
                alert('يرجى إدخال رقم الهاتف بصيغة صحيحة.');
                return;
            }

            try {
                if (!window.recaptchaVerifier) {
                    window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
                        'size': 'invisible'
                    });
                }
                confirmationResult = await signInWithPhoneNumber(auth, phoneNumber, window.recaptchaVerifier);
                document.getElementById('phoneStep1').classList.add('hidden');
                document.getElementById('phoneStep2').classList.remove('hidden');
                alert('✓ تم إرسال رمز التحقق إلى هاتفك بنجاح.');
            } catch (error) {
                alert('فشل إرسال رمز التحقق: ' + error.message);
            }
        };

        window.verifyPhoneOtpCode = async function() {
            let code = document.getElementById('phoneOtpCode').value.trim();
            if(!code) return alert('يرجى إدخال رمز التحقق.');

            try {
                let result = await confirmationResult.confirm(code);
                let user = result.user;
                let phoneNum = user.phoneNumber || 'رقم الهاتف';
                let assignedCompanyId = 'company_phone_' + user.uid.substring(0, 8);
                let finalUserName = 'مستخدم الهاتف (' + phoneNum.slice(-4) + ')';
                let userRole = 'مشرف أسطول';

                // تفعيل البصمة الإجبارية لمستخدم الهاتف
                await mandateBiometricLinking(finalUserName);

                const existingDoc = accountsData.find(a => a.companyId === assignedCompanyId);
                if (!existingDoc) {
                    await addDoc(accountsRef, {
                        name: finalUserName,
                        role: userRole,
                        companyId: assignedCompanyId,
                        phone: phoneNum,
                        biometricLinked: true,
                        date: new Date().toISOString().split('T')[0]
                    });
                }

                sessionStorage.setItem('eidco_session_auth', 'true');
                localStorage.setItem('eidco_v14_admin', finalUserName);
                localStorage.setItem('eidco_current_company_id', assignedCompanyId);

                alert('✓ تمت المصادقة ومزامنة الحساب بالسحابة بنجاح!');
                window.location.href = `./index.html?companyId=${encodeURIComponent(assignedCompanyId)}`;
            } catch (error) {
                alert('رمز التحقق غير صحيح: ' + error.message);
            }
        };

        window.openAddAccountModal = function() {
            document.getElementById('newAccountName').value = '';
            document.getElementById('addAccountModal').classList.add('active');
        };
        window.closeAddAccountModal = function() {
            document.getElementById('addAccountModal').classList.remove('active');
        };

        window.saveNewAccount = async function() {
            let nameInput = document.getElementById('newAccountName').value.trim();
            let roleInput = document.getElementById('newAccountRole').value;

            if (!nameInput) {
                alert('الرجاء إدخال اسم المسؤول.');
                return;
            }

            if (accountsData.some(a => a.name === nameInput)) {
                alert('هذا الاسم مسجل مسبقاً في السحابة.');
                return;
            }

            try {
                await mandateBiometricLinking(nameInput);

                let generatedCompanyId = 'company_' + Date.now();

                await addDoc(accountsRef, {
                    name: nameInput,
                    role: roleInput,
                    companyId: generatedCompanyId,
                    biometricLinked: true,
                    date: new Date().toISOString().split('T')[0]
                });
                alert('✓ تمت إضافة الحساب بالسحابة وتخصيص بيئة معزولة له بنجاح!');
                window.closeAddAccountModal();
            } catch (err) {
                alert('حدث خطأ أثناء الحفظ في سحابة Firebase: ' + err.message);
            }
        };

        window.resetDefaultAccounts = async function() {
            if (!confirm('هل تريد إعادة تعيين الحسابات للافتراضي وحذف كل الحسابات الأخرى من السحابة؟')) return;

            try {
                for (let acc of accountsData) {
                    await deleteDoc(doc(db, "accounts", acc.id));
                }
                await addDoc(accountsRef, {
                    name: FOUNDER_NAME,
                    role: 'مدير نظام رئيسي',
                    companyId: 'company_founder_karm',
                    biometricLinked: true,
                    date: new Date().toISOString().split('T')[0]
                });
                alert('تمت إعادة ضبط الحسابات سحابياً بنجاح.');
            } catch (err) {
                alert('حدث خطأ أثناء إعادة الضبط: ' + err.message);
            }
        };

        window.performBiometricAuth = async function() {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) {
                alert('يرجى إدخال اسم المستخدم أولاً لعمل المصادقة.');
                return;
            }

            const statusEl = document.getElementById('bioStatusText');
            statusEl.innerText = `جاري التحقق من السجلات السحابية لـ (${username})...`;
            statusEl.className = "text-xs text-amber-400 font-mono block font-bold animate-pulse";

            let matchedAccount = accountsData.find(a => a.name === username);

            if (!matchedAccount && username !== FOUNDER_NAME) {
                statusEl.innerText = "❌ اسم المستخدم غير مسجل في السحابة!";
                statusEl.className = "text-xs text-rose-400 font-mono block font-bold";
                alert("⚠️ عذراً، هذا الحساب غير موجود في قاعدة بيانات سحابة النظام المعتمدة.");
                return;
            }

            try {
                await signInAnonymously(auth);

                if (window.PublicKeyCredential && navigator.credentials) {
                    const publicKeyCredentialRequestOptions = {
                        challenge: Uint8Array.from("eidco_secure_challenge_2026", c => c.charCodeAt(0)),
                        timeout: 60000,
                        userVerification: "preferred"
                    };
                    await navigator.credentials.get({ publicKey: publicKeyCredentialRequestOptions }).catch(() => {});
                } else {
                    await new Promise(r => setTimeout(r, 1000));
                }

                statusEl.innerText = "✓ تمت المصادقة السحابية بنجاح! جاري التوجيه...";
                statusEl.className = "text-xs text-emerald-400 font-mono block font-bold";

                let assignedCompanyId = matchedAccount ? matchedAccount.companyId : 'company_founder_karm';

                sessionStorage.setItem('eidco_session_auth', 'true');
                localStorage.setItem('eidco_v14_admin', username);
                localStorage.setItem('eidco_current_company_id', assignedCompanyId);

                setTimeout(() => {
                    window.location.href = `./index.html?companyId=${encodeURIComponent(assignedCompanyId)}`;
                }, 800);

            } catch (error) {
                statusEl.innerText = "⚠️ خطأ في الاتصال بالسحابة: " + error.message;
                statusEl.className = "text-xs text-rose-400 font-mono block font-bold";
            }
        };
    </script>
</body>
</html>
