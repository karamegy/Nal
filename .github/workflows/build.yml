name: Build EIDCO Business OS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Fresh Android SDK & Tools
        shell: bash
        run: |
          set -euo pipefail

          # 1. تجهيز مجلد الـ SDK الخاص بنا
          export MY_SDK="$RUNNER_TEMP/my-sdk"
          mkdir -p "$MY_SDK/cmdline-tools"

          # 2. تنزيل أحدث أدوات Google مباشرة
          cd "$RUNNER_TEMP"
          curl -sSLo tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip -d "$MY_SDK/cmdline-tools"
          mv "$MY_SDK/cmdline-tools/cmdline-tools" "$MY_SDK/cmdline-tools/latest"

          # 3. تثبيت المكونات وتخطي التراخيص بالكامل
          SDKMANAGER="$MY_SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$MY_SDK" --licenses || true
          "$SDKMANAGER" --sdk_root="$MY_SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          # 4. زرع التراخيص يدوياً للتأكيد
          mkdir -p "$MY_SDK/licenses"
          cat << 'EOF' > "$MY_SDK/licenses/android-sdk-license"
          89330172225f4d81156c64d304d49d476119682d
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63718c303a650677591de6a4715842f8
          EOF

          # 5. أجبر نظام جيت هب كله يستخدم الـ SDK بتاعنا وبس!
          echo "ANDROID_HOME=$MY_SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$MY_SDK" >> $GITHUB_ENV

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Restore Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::سر KEYSTORE_BASE64 غير موجود!"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android.keystore
          test -s android.keystore
          chmod 600 android.keystore

      - name: Setup TWA Project & Manifest
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ ! -f "manifest.json" ]; then
            cat << 'EOF' > manifest.json
          {
            "name": "EIDCO Business OS",
            "short_name": "EIDCO OS",
            "start_url": "https://karamegy.github.io/Na2la/",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#000000",
            "icons": [
              {
                "src": "https://karamegy.github.io/Na2la/icon.png",
                "sizes": "512x512",
                "type": "image/png"
              }
            ]
          }
          EOF
          fi

          node -e '
            const fs = require("fs");
            const path = require("path");

            const jdkPath = process.env.JAVA_HOME;
            const androidSdkPath = process.env.ANDROID_HOME;
            const keystorePath = path.resolve("android.keystore");
            const alias = process.env.KEY_ALIAS || "my-key-alias";

            const bwDir = path.join(process.env.HOME, ".bubblewrap");
            if (!fs.existsSync(bwDir)) fs.mkdirSync(bwDir, { recursive: true });

            fs.writeFileSync(
              path.join(bwDir, "config.json"),
              JSON.stringify({ jdkPath, androidSdkPath }, null, 2)
            );

            const twaFile = "twa-manifest.json";
            let m = {};
            if (fs.existsSync(twaFile)) {
              m = JSON.parse(fs.readFileSync(twaFile, "utf8"));
            } else {
              m = {
                packageId: "io.github.karamegy.twa",
                host: "karamegy.github.io",
                name: "EIDCO Business OS",
                launcherName: "EIDCO OS",
                display: "standalone",
                themeColor: "#000000",
                navigationColor: "#000000",
                startUrl: "/Na2la/",
                iconUrl: "https://karamegy.github.io/Na2la/icon.png",
                maskableIconUrl: "https://karamegy.github.io/Na2la/icon.png",
                appVersionName: "1.0.0",
                appVersionCode: 1,
                shortcuts: [],
                generatorApp: "bubblewrap-cli",
                webManifestUrl: "https://karamegy.github.io/Na2la/manifest.json",
                fallbackType: "customtabs",
                features: {},
                alphaDependencies: { enabled: false },
                enableNotifications: true,
                scimitar: { enabled: false }
              };
            }

            m.jdkPath = jdkPath;
            m.androidSdkPath = androidSdkPath;
            m.signingKey = m.signingKey || {};
            m.signingKey.path = keystorePath;
            m.signingKey.alias = alias;

            fs.writeFileSync(twaFile, JSON.stringify(m, null, 2));
          '

      - name: Build Signed App (APK & AAB)
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          bubblewrap update --manifest=twa-manifest.json --skipVersionUpgrade

          bubblewrap build \
            --manifest=twa-manifest.json \
            --keyPassword="$KEY_PASSWORD" \
            --storePassword="$KEYSTORE_PASSWORD"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EIDCO-OS-Android-Release
          path: |
            *.apk
            *.aab
          if-no-files-found: error
          retention-days: 14

      - name: Clean Up Signing Key
        if: always()
        run: rm -f android.keystore
