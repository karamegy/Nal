Name: Build EIDCO Business OS App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: Decode Signing Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Build Web Assets (If needed)
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build --if-present
          fi

      - name: Setup Environment & Fix twa-manifest
        env:
          TARGET_JDK: ${{ env.JAVA_HOME }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # تحديث ملف twa-manifest ديناميكياً لتجنب مشاكل المسارات الصلبة وجعل Bubblewrap يتكفل بالباقي
          node -e '
            const fs = require("fs");
            const file = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            file.appVersionName = "8.0.0.0";
            file.appVersionCode = 24;
            file.jdkPath = process.env.TARGET_JDK;
            delete file.androidSdkPath; // حذف المسار اليدوي لكي يقوم Bubblewrap بتحميله واكتشافه تلقائياً
            if (process.env.KEY_ALIAS) {
              file.signingKey.alias = process.env.KEY_ALIAS;
            }
            fs.writeFileSync("twa-manifest.json", JSON.stringify(file, null, 2));
          '

      - name: Package Web App into Android Artifacts
        run: |
          npx @bubblewrap/cli build --manifest=twa-manifest.json --key-password="${{ secrets.KEY_PASSWORD }}" --store-password="${{ secrets.KEYSTORE_PASSWORD }}" --skip-sdk-install=false

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EIDCO-OS-Android-Release
          path: |
            ./*.apk
            ./*.aab
            ./manifest.json
            ./sw.js
            !android.keystore
