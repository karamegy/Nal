<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIDCO // إعدادات النظام</title>
    
    <!-- إعدادات الـ PWA وربط المانيست وعامل الخدمة وحماية الجلسة -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4f46e5">
    <script>
        if (!sessionStorage.getItem('eidco_session_auth') && localStorage.getItem('eidco_v13_auth_status') !== 'authenticated') {
            window.location.href = 'auth.html';
        }
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error: ', err));
            });
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #4f46e5; --primary-hover: #4338ca; --bg-main: #f8fafc; --card-bg: #ffffff; --border-color: #e2e8f0; --text-main: #0f172a; --text-muted: #64748b; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; margin: 0; padding-bottom: 5rem; }
        .corporate-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .btn-primary { background-color: var(--primary); color: #fff; border-radius: 12px; padding: 10px 20px; font-weight: 700; border: none; cursor: pointer; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; font-size: 0.875rem; font-weight: 700; color: var(--text-muted); text-decoration: none; }
        .nav-link:hover, .nav-link.active { background-color: #e0e7ff; color: var(--primary); }
    </style>
</head>
<body>
    <div class="flex min-h-screen">
        <aside class="hidden lg:flex flex-col w-72 p-6 bg-white border-l border-slate-200 sticky top-0 h-screen z-40">
            <div class="flex items-center gap-3 mb-8 px-2">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white"><i class="fa-solid fa-cube"></i></div>
                <div><h2 class="font-black text-slate-900 text-base">EIDCO // عيدكو</h2><span class="text-[10px] text-indigo-600 font-mono font-bold">BUSINESS OS</span></div>
            </div>
            <nav class="space-y-1.5 flex-1 overflow-y-auto">
                <a href="dashboard.html" class="nav-link"><i class="fa-solid fa-gauge-high"></i> لوحة التحكم الشاملة</a>
                <a href="index.html" class="nav-link"><i class="fa-solid fa-chart-pie"></i> لوحة المؤشرات</a>
                <a href="invoices.html" class="nav-link"><i class="fa-solid fa-file-invoice-dollar"></i> الفواتير الفردية</a>
                <a href="batch-invoices.html" class="nav-link"><i class="fa-solid fa-file-lines"></i> الفواتير المجمعة</a>
                <a href="inventory.html" class="nav-link"><i class="fa-solid fa-boxes-stacked"></i> المخزن والأصناف</a>
                <a href="clients.html" class="nav-link"><i class="fa-solid fa-building-user"></i> حسابات العملاء</a>
                <a href="chat.html" class="nav-link"><i class="fa-solid fa-comments"></i> الشات والاتصالات</a>
                <a href="profile.html" class="nav-link"><i class="fa-solid fa-id-badge"></i> الملف الشخصي</a>
                <a href="vault.html" class="nav-link"><i class="fa-solid fa-vault"></i> الخزنة النقدية</a>
                <a href="map.html" class="nav-link"><i class="fa-solid fa-map-location-dot"></i> خريطة الأسطول GPS</a>
                <a href="auth.html" class="nav-link"><i class="fa-solid fa-fingerprint"></i> المصادقة البيومترية</a>
                <a href="settings.html" class="nav-link active"><i class="fa-solid fa-sliders"></i> الإعدادات والنسخ</a>
            </nav>
        </aside>

        <div class="flex-1 flex flex-col min-w-0">
            <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 py-4 sticky top-0 z-30">
                <h1 class="font-black text-slate-900 text-sm">إدارة قواعد البيانات والنظام</h1>
            </header>

            <main class="max-w-7xl w-full mx-auto p-6">
                <div class="corporate-card p-6 space-y-4">
                    <h2 class="font-bold text-sm text-slate-900">خيارات النسخ الاحتياطي والضبط</h2>
                    <div class="flex gap-4">
                        <button onclick="exportDatabase()" class="btn-primary text-xs flex items-center gap-2"><i class="fa-solid fa-download"></i> تصدير النسخة الاحتياطية</button>
                        <button onclick="resetSystemData()" class="bg-rose-50 text-rose-600 border border-rose-200 px-5 py-2.5 rounded-xl text-xs font-bold cursor-pointer hover:bg-rose-100 transition">إعادة ضبط المصنع</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        function exportDatabase() {
            let state = {
                adminName: localStorage.getItem('eidco_v13_admin'),
                clients: JSON.parse(localStorage.getItem('eidco_v13_clients')),
                products: JSON.parse(localStorage.getItem('eidco_v13_products')),
                invoices: JSON.parse(localStorage.getItem('eidco_v13_invoices')),
                transactions: JSON.parse(localStorage.getItem('eidco_v13_transactions')),
                chats: JSON.parse(localStorage.getItem('eidco_v13_chats'))
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const dl = document.createElement('a'); dl.setAttribute("href", dataStr); dl.setAttribute("download", "EIDCO_v13_Backup.json");
            document.body.appendChild(dl); dl.click(); dl.remove();
        }
        function resetSystemData() {
            if(confirm('⚠️ تحذير: هل أنت متأكد من مسح كافة البيانات؟')) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
