name: Build EIDCO Business OS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > signing.keystore
            chmod 600 signing.keystore
          fi

      - name: Build Android App via Capacitor
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
        run: |
          set -euo pipefail

          # 1. تجهيز مجلد الويب www ونسخ الملفات
          mkdir -p www
          cp -r *.html *.js *.json assets www/ 2>/dev/null || true
          if [ ! -f "www/index.html" ]; then
            cp www/auth.html www/index.html 2>/dev/null || true
          fi

          # 1.1 إنشاء ملف assetlinks.json للتأكيد الآلي للنطاق والبصمة
          mkdir -p www/.well-known
          cat << 'EOF' > www/.well-known/assetlinks.json
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "io.github.karamegy.twa",
                "sha256_cert_fingerprints":
                  ["64:FD:12:52:9E:51:45:41:86:E8:CD:1D:2F:79:0D:32:CF:BE:F0:CE:06:FF:8F:09:07:EE:5C:90:8C:39:EE:D5"]
              }
            }
          ]
          EOF

          # 2. إعداد ملف capacitor.config.json مع تفعيل إعدادات Google Auth للمشروع
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "io.github.karamegy.twa",
            "appName": "EIDCO Business OS",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://karamegy.github.io/Nal/auth.html",
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": [
                "karamegy.github.io",
                "*.firebaseapp.com",
                "*.googleapis.com"
              ]
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "backgroundColor": "#020617"
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 2000,
                "backgroundColor": "#020617",
                "androidScaleType": "CENTER_CROP",
                "splashFullScreen": true,
                "splashImmersive": true
              },
              "GoogleAuth": {
                "scopes": ["profile", "email"],
                "serverClientId": "515898424721-ovtpchg5l9ap0r7ik78thic3g8h35kvj.apps.googleusercontent.com",
                "forceCodeForRefreshToken": true
              }
            }
          }
          EOF

          # 3. تثبيت مكتبات الكاباسيتور مع إضافة مكتبة Google Auth والأيقونات
          npm install @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/assets @codetrix-studio/capacitor-google-auth --save-dev --legacy-peer-deps

          # 4. إعادة إنشاء منصة أندرويد
          rm -rf android
          npx cap add android

          # 5. حقن ملف MainActivity.java المخصص بالمسار المطابق للحزمة
          mkdir -p android/app/src/main/java/io/github/karamegy/twa
          cat << 'EOF' > android/app/src/main/java/io/github/karamegy/twa/MainActivity.java
          package io.github.karamegy.twa;

          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.view.WindowManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.Toast;

          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import com.getcapacitor.BridgeActivity;

          import java.io.File;
          import java.io.FileOutputStream;

          public class MainActivity extends BridgeActivity {

              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST_CODE = 1001;
              private static final int PERMISSION_REQUEST_CODE = 2002;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = this.bridge.getWebView();

                  if (webView != null) {
                      WebSettings settings = webView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setAllowFileAccess(true);
                      settings.setAllowContentAccess(true);
                      settings.setDatabaseEnabled(true);
                      settings.setGeolocationEnabled(true);
                      settings.setMediaPlaybackRequiresUserGesture(false);

                      webView.addJavascriptInterface(new WebAppInterface(this), "AndroidBridge");

                      webView.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                              callback.invoke(origin, true, false);
                          }

                          @Override
                          public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                              if (MainActivity.this.filePathCallback != null) {
                                  MainActivity.this.filePathCallback.onReceiveValue(null);
                              }
                              MainActivity.this.filePathCallback = filePathCallback;

                              Intent intent = fileChooserParams.createIntent();
                              try {
                                  startActivityForResult(intent, FILE_CHOOSER_REQUEST_CODE);
                              } catch (Exception e) {
                                  MainActivity.this.filePathCallback = null;
                                  Toast.makeText(MainActivity.this, "تعذر فتح مستعرض الملفات", Toast.LENGTH_SHORT).show();
                                  return false;
                              }
                              return true;
                          }
                      });
                  }

                  requestAppPermissions();
              }

              private void requestAppPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      String[] permissions = {
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION,
                              Manifest.permission.VIBRATE,
                              Manifest.permission.READ_EXTERNAL_STORAGE,
                              Manifest.permission.WRITE_EXTERNAL_STORAGE,
                              Manifest.permission.CAMERA
                      };

                      boolean needRequest = false;
                      for (String perm : permissions) {
                          if (ContextCompat.checkSelfPermission(this, perm) != PackageManager.PERMISSION_GRANTED) {
                              needRequest = true;
                              break;
                          }
                      }

                      if (needRequest) {
                          ActivityCompat.requestPermissions(this, permissions, PERMISSION_REQUEST_CODE);
                      }
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                      if (filePathCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == RESULT_OK && data != null) {
                          String dataString = data.getDataString();
                          if (dataString != null) {
                              results = new Uri[]{Uri.parse(dataString)};
                          }
                      }
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }

              public class WebAppInterface {
                  Context mContext;

                  WebAppInterface(Context c) {
                      mContext = c;
                  }

                  @JavascriptInterface
                  public void showToast(String message) {
                      Toast.makeText(mContext, message, Toast.LENGTH_SHORT).show();
                  }

                  @JavascriptInterface
                  public void vibrate(long milliseconds) {
                      Vibrator v = (Vibrator) mContext.getSystemService(Context.VIBRATOR_SERVICE);
                      if (v != null && v.hasVibrator()) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              v.vibrate(VibrationEffect.createOneShot(milliseconds, VibrationEffect.DEFAULT_AMPLITUDE));
                          } else {
                              v.vibrate(milliseconds);
                          }
                      }
                  }

                  @JavascriptInterface
                  public void keepScreenOn(final boolean keepOn) {
                      runOnUiThread(() -> {
                          if (keepOn) {
                              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          } else {
                              getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          }
                      });
                  }

                  @JavascriptInterface
                  public void shareText(String text) {
                      Intent sendIntent = new Intent();
                      sendIntent.setAction(Intent.ACTION_SEND);
                      sendIntent.putExtra(Intent.EXTRA_TEXT, text);
                      sendIntent.setType("text/plain");
                      Intent shareIntent = Intent.createChooser(sendIntent, "مشاركة تقرير EIDCO");
                      mContext.startActivity(shareIntent);
                  }

                  @JavascriptInterface
                  public void downloadFile(String filename, String base64Data) {
                      try {
                          byte[] pdfAsBytes = android.util.Base64.decode(base64Data.replaceFirst("^data:image/[^;]+;base64,", ""), android.util.Base64.DEFAULT);
                          File path = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                          File file = new File(path, filename);
                          FileOutputStream os = new FileOutputStream(file, false);
                          os.write(pdfAsBytes);
                          os.flush();
                          os.close();
                          Toast.makeText(mContext, "تم حفظ الملف بنجاح في التنزيلات: " + filename, Toast.LENGTH_LONG).show();
                      } catch (Exception e) {
                          Toast.makeText(mContext, "خطأ أثناء حفظ الملف: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                      }
                  }
              }
          }
          EOF

          # 6. تجهيز الأيقونة
          mkdir -p assets
          if [ -f "icon-new-512.png" ]; then
            cp icon-new-512.png assets/icon.png 2>/dev/null || true
          elif [ -f "logo.png" ]; then
            cp logo.png assets/icon.png 2>/dev/null || true
          fi

          if [ -f "assets/icon.png" ]; then
            npx @capacitor/assets generate --android || true
          fi

          # 7. نسخ google-services.json إلى مشروع الأندرويد إذا وجد
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/ 2>/dev/null || true
          fi

          # 8. تجهيز AndroidManifest و file_paths و strings مع تضمين Google Client IDs بدقة
          mkdir -p android/app/src/main/res/xml/
          cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="external_files" path="." />
              <cache-path name="cache_files" path="." />
              <files-path name="files_path" path="." />
          </paths>
          EOF

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools"
              package="io.github.karamegy.twa">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.USE_FINGERPRINT" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="http" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme"
                  tools:overrideLibrary="com.getcapacitor.android">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name="io.github.karamegy.twa.MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="karamegy.github.io" android:pathPrefix="/Nal" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="io.github.karamegy.twa.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

              </application>

          </manifest>
          EOF

          mkdir -p android/app/src/main/res/values/
          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">EIDCO Business OS</string>
              <string name="title_activity_main">EIDCO OS</string>
              <string name="package_name">io.github.karamegy.twa</string>
              <string name="custom_url_scheme">io.github.karamegy.twa</string>
              <string name="server_client_id">515898424721-ovtpchg5l9ap0r7ik78thic3g8h35kvj.apps.googleusercontent.com</string>
              <string name="default_web_client_id">515898424721-ovtpchg5l9ap0r7ik78thic3g8h35kvj.apps.googleusercontent.com</string>
              <string name="file_provider_authority">io.github.karamegy.twa.fileprovider</string>
          </resources>
          EOF

          # 9. نسخ ملف التوقيع
          HAS_KEYSTORE=false
          if [ -f "signing.keystore" ]; then
            cp signing.keystore android/app/
            HAS_KEYSTORE=true
          fi
          export HAS_KEYSTORE

          # 10. مزامنة Capacitor مع منصة أندرويد
          npx cap sync android

          # 11. إضافة إعدادات التوقيع والإصدارات بنمط الإلحاق (>> ) للحفاظ على روابط كاباسيتور الأصلية
          cat << EOF >> android/app/build.gradle

          android {
              defaultConfig {
                  applicationId "io.github.karamegy.twa"
                  minSdk 24
                  targetSdk 34
                  versionCode 24
                  versionName "8.0.0.0"
              }
              signingConfigs {
                  release {
                      if (file('signing.keystore').exists()) {
                          storeFile file('signing.keystore')
                          storePassword '$KEYSTORE_PASSWORD'
                          keyAlias '$KEY_ALIAS'
                          keyPassword '$KEY_PASSWORD'
                      }
                  }
              }
              buildTypes {
                  release {
                      if (file('signing.keystore').exists()) {
                          signingConfig signingConfigs.release
                      }
                      minifyEnabled false
                  }
              }
          }
          EOF

          # 12. البناء بأمر موحد بدون Daemon وبدون Parallel لمنع قفل الملفات وحل خطأ JAR
          cd android
          chmod +x gradlew

          if [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon --no-parallel
          else
            ./gradlew assembleDebug --no-daemon --no-parallel
          fi

          # 13. تجميع وتوفير المخرجات النهائية
          cd ..
          mkdir -p output_artifacts
          find android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} ./output_artifacts/ \;
          
          find ./output_artifacts -type f -name "*.apk" | head -n 1 | xargs -I {} cp {} ./EIDCO-OS-release.apk || true
          find ./output_artifacts -type f -name "*.aab" | head -n 1 | xargs -I {} cp {} ./EIDCO-OS-release.aab || true
          
          touch ./EIDCO-OS-release.apk
          touch ./EIDCO-OS-release.aab

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EIDCO-OS-Android-Release
          path: |
            output_artifacts/*
            EIDCO-OS-release.apk
            EIDCO-OS-release.aab

      - name: Clean Up Signing Key
        if: always()
        run: rm -f signing.keystore android/app/signing.keystore
