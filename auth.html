<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIDCO // إدارة الحسابات والمصادقة المتقدمة المعزولة</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4f46e5">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error: ', err));
        });
      }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #4f46e5; --primary-hover: #4338ca; --bg-main: #0f172a; --card-bg: #1e293b; --border-color: #334155; --text-main: #f8fafc; --text-muted: #94a3b8; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 1rem; box-sizing: border-box; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        .corporate-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); width: 100%; box-sizing: border-box; }
        .corporate-input { background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 12px; padding: 12px 16px; transition: all 0.2s; box-sizing: border-box; width: 100%; }
        .corporate-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.3); }
        .btn-primary { background-color: var(--primary); color: #fff; border-radius: 12px; padding: 12px 20px; font-weight: 700; border: none; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; }
        .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        .custom-modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; box-sizing: border-box; }
        .custom-modal.active { display: flex !important; }
        @keyframes pulseRing {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 25px rgba(79, 70, 229, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
        }
        .ring-pulse { animation: pulseRing 2s infinite; }
    </style>
</head>
<body class="selection:bg-indigo-500 selection:text-white">

    <div class="corporate-card p-6 sm:p-8 max-w-lg w-full space-y-6 text-right relative overflow-hidden">
        <div class="absolute -top-12 -left-12 w-32 h-32 bg-indigo-600/20 rounded-full blur-2xl"></div>

        <!-- زر التثبيت البرمجي الظاهر عند جهوزية المتصفح -->
        <div id="installContainer" class="hidden text-center relative z-10">
            <button id="installAppBtn" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black py-3 px-5 rounded-xl text-xs flex items-center justify-center gap-2 mx-auto shadow-lg transition cursor-pointer w-full border border-emerald-400/30">
                <i class="fa-solid fa-download text-amber-300 text-sm"></i> تثبيت تطبيق EIDCO الرسمي على الهاتف
            </button>
        </div>

        <div class="flex items-center gap-3 relative z-10">
            <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/30 shrink-0">
                <i class="fa-solid fa-cube text-xl text-white"></i>
            </div>
            <div>
                <h1 class="text-base sm:text-lg font-black text-white">EIDCO v14 // الأمان المعزول</h1>
                <p class="text-[10px] text-slate-400 font-mono">تسجيل الدخول ومزامنة البصمة والحسابات السحابية</p>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 relative z-10 pt-2">
            <button onclick="signInWithGoogle()" class="bg-white hover:bg-slate-100 text-slate-900 font-bold py-2.5 px-4 rounded-xl text-xs flex items-center justify-center gap-2 transition shadow cursor-pointer border border-slate-200">
                <i class="fa-brands fa-google text-rose-500 text-sm"></i> تسجيل بـ Google
            </button>
            <button onclick="openPhoneAuthModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2.5 px-4 rounded-xl text-xs flex items-center justify-center gap-2 transition shadow cursor-pointer border border-slate-700">
                <i class="fa-solid fa-phone text-emerald-400 text-sm"></i> تسجيل برقم الهاتف
            </button>
        </div>

        <!-- زر الشكاوي والدعم الفني الجديد -->
        <div class="relative z-10">
            <button onclick="openComplaintsModal()" class="w-full bg-slate-800/80 hover:bg-slate-800 text-amber-400 border border-amber-500/30 font-bold py-2.5 px-4 rounded-xl text-xs flex items-center justify-center gap-2 transition cursor-pointer shadow">
                <i class="fa-solid fa-triangle-exclamation"></i> هل تواجه مشكلة؟ إرسال شكوى أو بلاغ للإدارة
            </button>
        </div>

        <div class="relative flex py-1 items-center z-10">
            <div class="flex-grow border-t border-slate-700"></div>
            <span class="flex-shrink mx-4 text-slate-500 text-[10px] font-mono">أو بالاسم والرقم السري والبصمة</span>
            <div class="flex-grow border-t border-slate-700"></div>
        </div>

        <div class="space-y-3 relative z-10">
            <div>
                <label class="block text-xs text-slate-300 font-bold mb-1">اسم المستخدم / الحساب / الشركة:</label>
                <input type="text" id="usernameInput" class="corporate-input text-xs font-bold" placeholder="أدخل اسم الحساب المسجل للبدء...">
            </div>
            <div>
                <label class="block text-xs text-slate-300 font-bold mb-1">الرقم السري (PIN Code):</label>
                <input type="password" id="userPinInput" class="corporate-input text-xs mono-font tracking-widest text-center text-base" placeholder="••••" maxlength="6">
            </div>
        </div>

        <div class="p-5 bg-slate-900/60 rounded-2xl border border-slate-800 text-center space-y-3 relative z-10">
            <div onclick="performBiometricAuth()" class="w-16 h-16 mx-auto bg-indigo-600/10 border-2 border-indigo-500/40 rounded-full flex items-center justify-center cursor-pointer shadow-lg hover:scale-105 transition ring-pulse" title="انقر لبدء الدخول">
                <i class="fa-solid fa-fingerprint text-2xl text-indigo-400"></i>
            </div>
            <div>
                <span class="text-xs text-indigo-400 font-mono block font-bold" id="bioStatusText">انقر لتأكيد الدخول والمزامنة</span>
                <span class="text-[10px] text-slate-500 block mt-1" id="selectedAccountDisplay">يرجى كتابة اسم الحساب والرقم السري ثم النقر للتحقق</span>
            </div>
        </div>

        <div class="text-center pt-2 border-t border-slate-800 text-[10px] text-slate-500 font-mono">
            <span>EIDCO Business OS &copy; 2026</span>
        </div>
    </div>

    <!-- نافذة إرسال شكوى جديدة -->
    <div id="complaintsModal" class="custom-modal">
        <div class="corporate-card p-6 max-w-md w-full space-y-4 text-right bg-slate-900 shadow-2xl border border-slate-700">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-sm text-white"><i class="fa-solid fa-headset ml-2 text-amber-400"></i> نظام الشكاوى والدعم الفني</h3>
                <button onclick="closeComplaintsModal()" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block mb-1 text-slate-300 font-bold">اسم الحساب / الشركة المُشتكية</label>
                    <input type="text" id="complaintSenderName" class="corporate-input text-xs" placeholder="أدخل اسمك أو اسم شركتك المسجل">
                </div>
                <div>
                    <label class="block mb-1 text-slate-300 font-bold">رقم الهاتف أو وسيلة التواصل</label>
                    <input type="text" id="complaintContact" class="corporate-input text-xs mono-font" placeholder="رقم الهاتف أو البريد الإلكتروني">
                </div>
                <div>
                    <label class="block mb-1 text-slate-300 font-bold">تفاصيل الشكوى أو المشكلة</label>
                    <textarea id="complaintMessage" rows="4" class="corporate-input text-xs resize-none" placeholder="اكتب تفاصيل المشكلة أو الشكوى بوضوح ليتسنى للإدارة مراجعتها..."></textarea>
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="submitUserComplaint()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold flex-1 py-2.5 rounded-xl text-xs transition cursor-pointer flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-paper-plane"></i> إرسال الشكوى للإدارة
                </button>
                <button onclick="closeComplaintsModal()" class="bg-slate-800 text-slate-300 hover:bg-slate-700 flex-1 py-2.5 rounded-xl text-xs font-bold cursor-pointer">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- نافذة تسجيل الهاتف -->
    <div id="phoneAuthModal" class="custom-modal">
        <div class="corporate-card p-6 max-w-sm w-full space-y-4 text-right bg-slate-900 shadow-2xl border border-slate-700">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-sm text-white"><i class="fa-solid fa-phone ml-2 text-emerald-400"></i> تسجيل الدخول برقم الهاتف</h3>
                <button onclick="closePhoneAuthModal()" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div class="space-y-3 text-xs">
                <div id="phoneStep1">
                    <label class="block mb-1 text-slate-300 font-bold">رقم الهاتف (مع رمز الدولة)</label>
                    <input type="tel" id="userPhoneNumber" class="corporate-input text-xs mono-font" placeholder="+2010xxxxxxxx">
                    <button onclick="sendPhoneVerificationCode()" class="btn-primary w-full mt-3 py-2.5 text-xs">إرسال رمز التحقق</button>
                </div>
                <div id="phoneStep2" class="hidden space-y-2">
                    <label class="block mb-1 text-slate-300 font-bold">أدخل رمز التحقق (OTP)</label>
                    <input type="text" id="phoneOtpCode" class="corporate-input text-xs mono-font text-center tracking-widest text-lg" placeholder="123456">
                    <button onclick="verifyPhoneOtpCode()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold w-full mt-2 py-2.5 rounded-xl text-xs transition cursor-pointer">تأكيد الرمز ودخول المنظومة</button>
                </div>
                <div id="recaptcha-container"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            setDoc, 
            addDoc,
            doc, 
            getDocs,
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { 
            getAuth, 
            signInAnonymously, 
            GoogleAuthProvider, 
            signInWithRedirect, 
            getRedirectResult, 
            RecaptchaVerifier, 
            signInWithPhoneNumber 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC69al0BNfnnMm7tzBTcnch5VdrhUugYtA",
            authDomain: "karamegy.github.io",
            projectId: "w2a-37531-672997",
            storageBucket: "w2a-37531-672997.firebasestorage.app",
            messagingSenderId: "515898424721",
            appId: "1:515898424721:web:f9d4d842bc621db2da6e30"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const accountsRef = collection(db, "accounts");
        const messagesRef = collection(db, "messages");

        const FOUNDER_NAME = "كرم حمدي عبدالعظيم";

        // التحقق التلقائي عند العودة من إعادة التوجيه
        getRedirectResult(auth).then(async (result) => {
            if (result && result.user) {
                await handleGoogleUserAuth(result.user);
            }
        }).catch((error) => {
            console.error("خطأ المصادقة أثناء التوجيه:", error);
        });

        onSnapshot(accountsRef, (snapshot) => {
            let accountsData = snapshot.docs.map(docSnap => ({
                id: docSnap.id,
                ...docSnap.data()
            }));

            if (accountsData.length === 0) {
                setDoc(doc(db, "accounts", "company_founder_karm"), {
                    name: FOUNDER_NAME,
                    pin: "1234",
                    role: 'مدير نظام رئيسي',
                    companyId: 'company_founder_karm',
                    biometricVerified: true,
                    date: new Date().toISOString().split('T')[0]
                }, { merge: true });
            }
        });

        // دوال نافذة الشكاوى
        window.openComplaintsModal = function() {
            let currentInputName = document.getElementById('usernameInput').value.trim();
            if(currentInputName) {
                document.getElementById('complaintSenderName').value = currentInputName;
            }
            document.getElementById('complaintsModal').classList.add('active');
        };

        window.closeComplaintsModal = function() {
            document.getElementById('complaintsModal').classList.remove('active');
        };

        window.submitUserComplaint = async function() {
            let name = document.getElementById('complaintSenderName').value.trim();
            let contact = document.getElementById('complaintContact').value.trim();
            let message = document.getElementById('complaintMessage').value.trim();

            if(!name || !message) {
                alert('الرجاء إدخال اسم الحساب وتفاصيل الشكوى.');
                return;
            }

            try {
                await addDoc(messagesRef, {
                    senderName: name,
                    contactInfo: contact || 'بدون وسائل تواصل',
                    message: message,
                    type: 'شكوى نظام',
                    status: 'قيد المراجعة',
                    date: new Date().toISOString().replace('T', ' ').substring(0, 19)
                });

                alert('✓ تم إرسال شكواك بنجاح إلى الإدارة الرئيسية، سيتم مراجعتها واتخاذ اللازم.');
                document.getElementById('complaintMessage').value = '';
                window.closeComplaintsModal();
            } catch(err) {
                alert('خطأ أثناء إرسال الشكوى: ' + err.message);
            }
        };

        async function promptDeviceVerification(userName) {
            try {
                if (window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
                    const isAvailable = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
                    if (isAvailable) {
                        const challenge = new Uint8Array(32);
                        window.crypto.getRandomValues(challenge);
                        try {
                            await navigator.credentials.create({
                                publicKey: {
                                    challenge: challenge,
                                    rp: { name: "EIDCO Business OS", id: window.location.hostname },
                                    user: { id: new TextEncoder().encode(userName), name: userName, displayName: userName },
                                    pubKeyCredParams: [{ alg: -7, type: "public-key" }],
                                    authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
                                    timeout: 60000
                                }
                            });
                            return true;
                        } catch (err) {
                            const assertion = await navigator.credentials.get({
                                publicKey: { challenge: challenge, timeout: 60000, userVerification: "required" }
                            });
                            return !!assertion;
                        }
                    }
                }
                return confirm(`🔒 تأكيد بصمة الهيكل الحيوية للحساب (${userName}): اضغط موافق لتفعيل مصادقة الجهاز.`);
            } catch (e) {
                return confirm(`🔒 نظام الأمان EIDCO: هل ترغب في تأكيد الدخول للحساب (${userName}) عبر بصمة الجهاز؟`);
            }
        }

        // تسجيل الدخول بإعادة التوجيه بدون نوافذ منبثقة
        window.signInWithGoogle = async function() {
            try {
                const provider = new GoogleAuthProvider();
                await signInWithRedirect(auth, provider);
            } catch (error) {
                alert('فشل تسجيل الدخول بواسطة Google: ' + error.message);
            }
        };

        // معالجة بيانات الحساب بعد نجاح الدخول
        async function handleGoogleUserAuth(user) {
            try {
                let userEmail = user.email || '';
                let userDisplayName = user.displayName || userEmail.split('@')[0];
                let userPhotoUrl = user.photoURL || '';

                const querySnapshot = await getDocs(accountsRef);
                let cloudAccounts = querySnapshot.docs.map(d => ({ id: d.id, ...d.data() }));

                let existingAccount = cloudAccounts.find(a => (a.email && a.email.toLowerCase() === userEmail.toLowerCase()));
                
                if (existingAccount && existingAccount.isBanned) {
                    alert("⚠️ عذراً، تم حظر هذا الحساب من قِبل الإدارة لمخالفة شروط الاستخدام.");
                    return;
                }

                let assignedCompanyId;
                let finalUserName;
                let userRole = 'محاسب أول';

                if (existingAccount) {
                    finalUserName = existingAccount.name;
                    assignedCompanyId = existingAccount.companyId;
                    userRole = existingAccount.role || 'محاسب أول';
                } else {
                    finalUserName = userDisplayName;
                    let cleanEmailKey = userEmail.replace(/[^a-zA-Z0-9]/g, '_');
                    assignedCompanyId = 'company_google_' + (cleanEmailKey || user.uid.substring(0, 8));
                    
                    if (userEmail === 'haretg@gmail.com') {
                        assignedCompanyId = 'company_founder_karm';
                        finalUserName = FOUNDER_NAME;
                        userRole = 'مدير نظام رئيسي';
                    }

                    let pinCodeInput = prompt(`أهلاً بك يا ${finalUserName}! يرجى إدخال رقم سري (PIN) لحماية حسابك:`, "1234");
                    if (!pinCodeInput) pinCodeInput = "1234";

                    await setDoc(doc(db, "accounts", assignedCompanyId), {
                        name: finalUserName,
                        pin: pinCodeInput,
                        role: userRole,
                        companyId: assignedCompanyId,
                        email: userEmail,
                        avatar: userPhotoUrl,
                        isBanned: false,
                        date: new Date().toISOString().split('T')[0]
                    }, { merge: true });
                }

                let verified = await promptDeviceVerification(finalUserName);
                if (!verified) return;

                sessionStorage.setItem('eidco_biometric_verified', 'true');
                sessionStorage.setItem('eidco_session_auth', 'true');
                localStorage.setItem('eidco_v14_admin', finalUserName);
                localStorage.setItem('eidco_current_company_id', assignedCompanyId);

                const urlParams = new URLSearchParams(window.location.search);
                const redirectPage = urlParams.get('redirect') || 'index.html';

                alert(`✓ أهلاً بك يا ${finalUserName}, تمت مزامنة حسابك والدخول بنجاح!`);
                window.location.href = `${redirectPage}?companyId=${encodeURIComponent(assignedCompanyId)}`;
            } catch (error) {
                alert('خطأ أثناء معالجة بيانات التسجيل: ' + error.message);
            }
        }

        window.openPhoneAuthModal = function() {
            document.getElementById('phoneAuthModal').classList.add('active');
        };
        window.closePhoneAuthModal = function() {
            document.getElementById('phoneAuthModal').classList.remove('active');
        };

        let confirmationResult = null;

        window.sendPhoneVerificationCode = async function() {
            let phoneNumber = document.getElementById('userPhoneNumber').value.trim();
            if(!phoneNumber) {
                alert('يرجى إدخال رقم الهاتف بصيغة صحيحة.');
                return;
            }

            try {
                if (!window.recaptchaVerifier) {
                    window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { 'size': 'invisible' });
                }
                confirmationResult = await signInWithPhoneNumber(auth, phoneNumber, window.recaptchaVerifier);
                document.getElementById('phoneStep1').classList.add('hidden');
                document.getElementById('phoneStep2').classList.remove('hidden');
                alert('✓ تم إرسال رمز التحقق إلى هاتفك بنجاح.');
            } catch (error) {
                alert('فشل إرسال رمز التحقق: ' + error.message);
            }
        };

        window.verifyPhoneOtpCode = async function() {
            let code = document.getElementById('phoneOtpCode').value.trim();
            if(!code) return alert('يرجى إدخال رمز التحقق.');

            try {
                let result = await confirmationResult.confirm(code);
                let user = result.user;
                let phoneNum = user.phoneNumber || 'رقم الهاتف';

                const querySnapshot = await getDocs(accountsRef);
                let cloudAccounts = querySnapshot.docs.map(d => ({ id: d.id, ...d.data() }));

                let existingAccount = cloudAccounts.find(a => a.phone === phoneNum);
                if (existingAccount && existingAccount.isBanned) {
                    alert("⚠️ عذراً، هذا الحساب محظور من قِبل الإدارة.");
                    return;
                }

                let assignedCompanyId = 'company_phone_' + user.uid.substring(0, 8);
                let finalUserName = 'مستخدم الهاتف (' + phoneNum.slice(-4) + ')';
                let userRole = 'مشرف أسطول';

                if (existingAccount) {
                    assignedCompanyId = existingAccount.companyId;
                    finalUserName = existingAccount.name;
                } else {
                    let pinCodeInput = prompt(`يرجى إدخال رقم سري (PIN) لحماية حساب هاتفك:`, "1234");
                    if (!pinCodeInput) pinCodeInput = "1234";

                    await setDoc(doc(db, "accounts", assignedCompanyId), {
                        name: finalUserName,
                        pin: pinCodeInput,
                        role: userRole,
                        companyId: assignedCompanyId,
                        phone: phoneNum,
                        isBanned: false,
                        date: new Date().toISOString().split('T')[0]
                    }, { merge: true });
                }

                sessionStorage.setItem('eidco_biometric_verified', 'true');
                sessionStorage.setItem('eidco_session_auth', 'true');
                localStorage.setItem('eidco_v14_admin', finalUserName);
                localStorage.setItem('eidco_current_company_id', assignedCompanyId);

                const urlParams = new URLSearchParams(window.location.search);
                const redirectPage = urlParams.get('redirect') || 'index.html';

                alert('✓ تمت المصادقة ومزامنة الحساب ودخول المنظومة بنجاح!');
                window.location.href = `${redirectPage}?companyId=${encodeURIComponent(assignedCompanyId)}`;
            } catch (error) {
                alert('رمز التحقق غير صحيح: ' + error.message);
            }
        };

        window.performBiometricAuth = async function() {
            const username = document.getElementById('usernameInput').value.trim();
            const pinInput = document.getElementById('userPinInput').value.trim();

            if (!username) {
                alert('يرجى إدخال اسم المستخدم أولاً.');
                return;
            }
            if (!pinInput) {
                alert('يرجى إدخال الرقم السري (PIN) الخاص بالحساب.');
                return;
            }

            const statusEl = document.getElementById('bioStatusText');
            statusEl.innerText = `جاري التحقق من السجلات السحابية لـ (${username})...`;
            statusEl.className = "text-xs text-amber-400 font-mono block font-bold animate-pulse";

            try {
                const querySnapshot = await getDocs(accountsRef);
                let cloudAccounts = querySnapshot.docs.map(d => ({ id: d.id, ...d.data() }));

                let matchedAccount = cloudAccounts.find(a => a.name === username);
                
                if (matchedAccount && matchedAccount.isBanned) {
                    statusEl.innerText = "❌ عذراً، هذا الحساب محظور من قِبل الإدارة!";
                    statusEl.className = "text-xs text-rose-400 font-mono block font-bold";
                    alert("⚠️ تنبيه: هذا الحساب تم حظره نهائياً بسبب شكاوى ومخالفات مسجلة ضده.");
                    return;
                }

                let assignedCompanyId;

                if (!matchedAccount) {
                    let cleanNameKey = username.replace(/[^a-zA-Z0-9أ-ي]/g, '_');
                    assignedCompanyId = 'company_' + cleanNameKey + '_' + Date.now().toString().slice(-4);
                    
                    if (username === FOUNDER_NAME) {
                        assignedCompanyId = 'company_founder_karm';
                    }

                    await setDoc(doc(db, "accounts", assignedCompanyId), {
                        name: username,
                        pin: pinInput,
                        role: 'محاسب أول',
                        companyId: assignedCompanyId,
                        biometricVerified: true,
                        isBanned: false,
                        date: new Date().toISOString().split('T')[0]
                    }, { merge: true });

                    statusEl.innerText = "✓ تم تسجيل الحساب الجديد ودمجه بالسحابة بنجاح!";
                } else {
                    let expectedPin = matchedAccount.pin || "1234";
                    if (pinInput !== expectedPin) {
                        statusEl.innerText = "❌ الرقم السري (PIN) غير صحيح!";
                        statusEl.className = "text-xs text-rose-400 font-mono block font-bold";
                        alert("⚠️ تنبيه: الرقم السري المدخل غير مطابق للرقم السري المسجل لهذا الحساب.");
                        return;
                    }
                    assignedCompanyId = matchedAccount.companyId;
                }

                let verified = await promptDeviceVerification(username);
                if (!verified) {
                    statusEl.innerText = "❌ تم إلغاء تأكيد البصمة أو فشل التعرف.";
                    statusEl.className = "text-xs text-rose-400 font-mono block font-bold";
                    return;
                }

                await signInAnonymously(auth);

                statusEl.innerText = "✓ تمت المطابقة وتأكيد البصمة بنجاح! جاري التوجيه...";
                statusEl.className = "text-xs text-emerald-400 font-mono block font-bold";

                sessionStorage.setItem('eidco_biometric_verified', 'true');
                sessionStorage.setItem('eidco_session_auth', 'true');
                localStorage.setItem('eidco_v14_admin', username);
                localStorage.setItem('eidco_current_company_id', assignedCompanyId);

                const urlParams = new URLSearchParams(window.location.search);
                const redirectPage = urlParams.get('redirect') || 'index.html';

                setTimeout(() => {
                    window.location.href = `${redirectPage}?companyId=${encodeURIComponent(assignedCompanyId)}`;
                }, 800);

            } catch (error) {
                statusEl.innerText = "⚠️ خطأ في المصادقة السحابية: " + error.message;
                statusEl.className = "text-xs text-rose-400 font-mono block font-bold";
            }
        };
    </script>
</body>
</html>
