name: Build EIDCO Business OS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Bubblewrap CLI
        run: npm install --global @bubblewrap/cli

      - name: Check Secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -f manifest.json
          test -f twa-manifest.json

          for name in KEYSTORE_BASE64 \
                      BUBBLEWRAP_KEYSTORE_PASSWORD \
                      BUBBLEWRAP_KEY_PASSWORD \
                      KEY_ALIAS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

      - name: Restore Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/android.keystore"
          test -s "$RUNNER_TEMP/android.keystore"
          chmod 600 "$RUNNER_TEMP/android.keystore"

      - name: Configure Bubblewrap & Manifest
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.bubblewrap"

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const jdkPath = process.env.JAVA_HOME;
          const androidSdkPath = process.env.ANDROID_HOME;
          const keystorePath = process.env.RUNNER_TEMP + '/android.keystore';
          const keyAlias = process.env.KEY_ALIAS;

          // 1. كتابة config.json الخاص بـ Bubblewrap
          fs.writeFileSync(
            path.join(process.env.HOME, '.bubblewrap', 'config.json'),
            JSON.stringify({ jdkPath, androidSdkPath }, null, 2)
          );

          // 2. تحديث twa-manifest.json بالمسارات الفعلية
          const manifestPath = 'twa-manifest.json';
          const m = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));

          m.jdkPath = jdkPath;
          m.androidSdkPath = androidSdkPath;
          m.signingKey = m.signingKey || {};
          m.signingKey.path = keystorePath;
          m.signingKey.alias = keyAlias;

          fs.writeFileSync(manifestPath, JSON.stringify(m, null, 2));
          NODE

      - name: Update Android Project
        run: |
          bubblewrap update --manifest=./twa-manifest.json --skipVersionUpgrade

      - name: Build Signed APK and AAB
        shell: bash
        run: |
          set -euo pipefail

          bubblewrap build \
            --keyPassword="${BUBBLEWRAP_KEY_PASSWORD}" \
            --storePassword="${BUBBLEWRAP_KEYSTORE_PASSWORD}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EIDCO-OS-Android-Release
          path: |
            *.apk
            *.aab
          if-no-files-found: error
          retention-days: 14

      - name: Clean Up Signing Key
        if: always()
        run: rm -f "$RUNNER_TEMP/android.keystore"
