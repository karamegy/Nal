name: Build EIDCO Business OS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Complete Android SDK Environment
        shell: bash
        run: |
          set -euo pipefail

          # 1. إصلاح الصلاحيات وتجهيز المجلد
          sudo chown -R $(whoami):$(id -gn) "$ANDROID_HOME"

          # 2. قبول جميع التراخيص
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          # 3. تثبيت حزم Android API و Build-tools المطلوبة بواسطة Bubblewrap
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Restore Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing secret: KEYSTORE_BASE64"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android.keystore
          test -s android.keystore
          chmod 600 android.keystore

      - name: Configure Bubblewrap & twa-manifest
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.bubblewrap

          node -e '
            const fs = require("fs");
            const path = require("path");

            const jdkPath = process.env.JAVA_HOME;
            const androidSdkPath = process.env.ANDROID_HOME;
            const keystorePath = path.resolve("android.keystore");
            const alias = process.env.KEY_ALIAS || "my-key-alias";

            // 1. كتابة config.json الخاص بـ Bubblewrap
            fs.writeFileSync(
              path.join(process.env.HOME, ".bubblewrap", "config.json"),
              JSON.stringify({ jdkPath, androidSdkPath }, null, 2)
            );

            // 2. تحديث twa-manifest.json بالمفتاح والمسارات المعتمدة
            const twaFile = "twa-manifest.json";
            let m = {};
            if (fs.existsSync(twaFile)) {
              m = JSON.parse(fs.readFileSync(twaFile, "utf8"));
            } else {
              m = {
                packageId: "io.github.karamegy.twa",
                host: "karamegy.github.io",
                name: "EIDCO Business OS",
                launcherName: "EIDCO OS",
                display: "standalone",
                themeColor: "#000000",
                navigationColor: "#000000",
                startUrl: "/Na2la/",
                iconUrl: "https://karamegy.github.io/Na2la/icon.png",
                maskableIconUrl: "https://karamegy.github.io/Na2la/icon.png",
                appVersionName: "1.0.0",
                appVersionCode: 1,
                shortcuts: [],
                generatorApp: "bubblewrap-cli",
                webManifestUrl: "https://karamegy.github.io/Na2la/manifest.json",
                fallbackType: "customtabs",
                features: {},
                alphaDependencies: { enabled: false },
                enableNotifications: true,
                scimitar: { enabled: false }
              };
            }

            m.jdkPath = jdkPath;
            m.androidSdkPath = androidSdkPath;
            m.signingKey = m.signingKey || {};
            m.signingKey.path = keystorePath;
            m.signingKey.alias = alias;

            fs.writeFileSync(twaFile, JSON.stringify(m, null, 2));
          '

      - name: Build Signed APK and AAB via Gradle
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          # تحديث هيكل مشروع أندرويد
          bubblewrap update --manifest=twa-manifest.json

          # البناء المباشر للتطبيق المنسق لتجاوز فحص مسار CLI
          bubblewrap build \
            --manifest=twa-manifest.json \
            --keyPassword="$KEY_PASSWORD" \
            --storePassword="$KEYSTORE_PASSWORD"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EIDCO-OS-Android-Release
          path: |
            *.apk
            *.aab
          if-no-files-found: error
          retention-days: 14

      - name: Clean Up Signing Key
        if: always()
        run: rm -f android.keystore
